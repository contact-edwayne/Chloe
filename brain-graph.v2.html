document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

dy ol { padding-left: 20px; margin: 0 0 12px; }\n  .panel-body li { margin: 3px 0; }\n  .panel-body blockquote {\n    border-left: 2px solid var(--cyan); padding: 4px 12px; margin: 10px 0;\n    color: var(--ink-dim); background: rgba(88,230,255,0.04);\n  }\n\n  /* ---------- tweaks panel (bottom-right collapsible) ---------- */\n  .tweaks {\n    position: fixed; bottom: 56px; right: 18px; z-index: 35;\n    width: 240px;\n    background: linear-gradient(180deg, rgba(8,18,26,0.92), rgba(4,10,16,0.86));\n    border: 1px solid var(--rule);\n    backdrop-filter: blur(8px);\n    -webkit-backdrop-filter: blur(8px);\n    transform: translateY(calc(100% + 76px));\n    transition: transform 0.3s cubic-bezier(0.2,0.7,0.2,1);\n    display: none;\n  }\n  .tweaks.show { display: block; }\n  .tweaks.open { transform: translateY(0); }\n  .tweaks header {\n    padding: 8px 10px; border-bottom: 1px solid var(--rule);\n    display: flex; align-items: center; justify-content: space-between;\n    font-family: \"Orbitron\", sans-serif; font-size: 10px; letter-spacing: 0.32em; color: var(--ink-dim); text-transform: uppercase;\n  }\n  .tweaks .body { padding: 10px 12px; display: grid; gap: 10px; font-size: 11px; }\n  .tweaks label { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: center; color: var(--ink-dim); letter-spacing: 0.16em; text-transform: uppercase; font-size: 9.5px; }\n  .tweaks label .v { color: var(--cyan-bright); font-variant-numeric: tabular-nums; font-size: 10.5px; }\n  .tweaks input[type=range] { grid-column: 1 / -1; -webkit-appearance: none; appearance: none; height: 18px; background: transparent; }\n  .tweaks input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--rule); }\n  .tweaks input[type=range]::-moz-range-track { height: 2px; background: var(--rule); }\n  .tweaks input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--cyan); border: none; margin-top: -5px; box-shadow: 0 0 6px var(--cyan); }\n  .tweaks input[type=range]::-moz-range-thumb { width: 12px; height: 12px; background: var(--cyan); border: none; box-shadow: 0 0 6px var(--cyan); }\n  .tweaks .seg { display: grid; grid-auto-flow: column; gap: 0; border: 1px solid var(--rule); margin-top: 2px; }\n  .tweaks .seg button {\n    background: transparent; border: none; color: var(--ink-dim);\n    padding: 5px 8px; font: inherit; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;\n    cursor: pointer; border-left: 1px solid var(--rule);\n  }\n  .tweaks .seg button:first-child { border-left: none; }\n  .tweaks .seg button.on { background: rgba(88,230,255,0.14); color: var(--cyan-bright); }\n  .tweaks-toggle {\n    position: fixed; bottom: 16px; right: 270px; z-index: 35;\n    padding: 6px 10px; background: transparent; border: 1px solid var(--rule); color: var(--ink-dim);\n    font-family: \"Orbitron\", sans-serif; font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase;\n    cursor: pointer; display: none;\n  }\n  .tweaks-toggle:hover { color: var(--cyan); border-color: var(--cyan); }\n  .tweaks-toggle.show { display: block; }\n\n  /* ---------- node tooltip ---------- */\n  .tip {\n    position: fixed; z-index: 28;\n    pointer-events: none;\n    background: rgba(4,10,16,0.92);\n    border: 1px solid var(--cyan);\n    padding: 6px 10px;\n    font-size: 11px; letter-spacing: 0.1em;\n    color: var(--cyan-bright);\n    box-shadow: 0 0 16px rgba(88,230,255,0.3);\n    transform: translate(12px, -50%);\n    opacity: 0; transition: opacity 0.12s;\n    white-space: nowrap;\n  }\n  .tip.show { opacity: 1; }\n  .tip .t { font-family: \"Orbitron\", sans-serif; font-size: 10px; letter-spacing: 0.28em; color: var(--ink-dim); text-transform: uppercase; }\n\n  /* ---------- responsive ---------- */\n  @media (max-width: 1100px) {\n    .legend .item .ll { display: none; }\n    .stat { min-width: 70px; padding: 8px 12px; }\n    .panel { width: min(420px, 90vw); }\n    .telemetry .panel { min-width: 200px; }\n  }\n<\/style>\n<\/head>\n<body>\n\n\n\n<div class=\"backdrop\"><\/div>\n<div class=\"grid\"><\/div>\n<canvas id=\"c-stars\"><\/canvas>\n<canvas id=\"c-edges\"><\/canvas>\n<canvas id=\"c-halos\"><\/canvas>\n<canvas id=\"c-orbs\"><\/canvas>\n<div class=\"vignette\"><\/div>\n\n<header class=\"hud-top\">\n  <div class=\"hud-frame brand\">\n    <div class=\"mark\"><\/div>\n    <div class=\"text\">\n      <div class=\"kicker\">CHLOE // SYS-04<\/div>\n      <div class=\"name\">B<span>R<\/span>AIN<span style=\"opacity:0.5\">\u00b7<\/span>GRAPH<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"hud-frame stats\" id=\"stats\">\n    <div class=\"stat\"><div class=\"k\">Pages<\/div><div class=\"v\" id=\"s-pages\">\u2014<\/div><\/div>\n    <div class=\"stat\"><div class=\"k\">Links<\/div><div class=\"v\" id=\"s-links\">\u2014<\/div><\/div>\n    <div class=\"stat\"><div class=\"k\">Hubs<\/div><div class=\"v\" id=\"s-hubs\">\u2014<\/div><\/div>\n    <div class=\"stat\"><div class=\"k\">Ghosts<\/div><div class=\"v\" id=\"s-ghosts\">\u2014<\/div><\/div>\n  <\/div>\n  <div class=\"hud-frame legend bk2\" id=\"legend\">\n    <div class=\"lab\">Index<\/div>\n  <\/div>\n  <button class=\"hud-frame esc-btn bk2\" id=\"esc-btn\" title=\"Close brain graph\">\n    <span class=\"key\">ESC<\/span><span>CLOSE<\/span>\n  <\/button>\n<\/header>\n\n<aside class=\"telemetry\">\n  <div class=\"panel\">\n    <h4><span class=\"dot\"><\/span>Live Telemetry<\/h4>\n    <dl>\n      <dt>Source<\/dt><dd id=\"t-source\">\u2026probing<\/dd>\n      <dt>Render<\/dt><dd><span id=\"t-fps\">\u2014<\/span> fps <span class=\"small\" id=\"t-frame\">\u2014 ms/f<\/span><\/dd>\n      <dt>Cursor<\/dt><dd id=\"t-cursor\">\u2014 \u00b7 \u2014<\/dd>\n      <dt>Zoom<\/dt><dd id=\"t-zoom\">1.00\u00d7<\/dd>\n      <dt>Hover<\/dt><dd id=\"t-hover\" style=\"color:var(--ink-dim)\">\u2014 none \u2014<\/dd>\n    <\/dl>\n  <\/div>\n<\/aside>\n\n<div class=\"controls\">\n  <span><span class=\"k\">Drag<\/span> Pan<\/span>\n  <span class=\"sep\"><\/span>\n  <span><span class=\"k\">Wheel<\/span> Zoom<\/span>\n  <span class=\"sep\"><\/span>\n  <span><span class=\"k\">Click<\/span> Read<\/span>\n<\/div>\n\n<aside class=\"read-panel\" id=\"panel\">\n  <div class=\"read-panel-inner\">\n    <button class=\"panel-close\" id=\"panel-close\" aria-label=\"Close\">\u00d7<\/button>\n    <div class=\"panel-head\">\n      <div class=\"type-tag\" id=\"p-type\"><i><\/i><span>\u2014<\/span><\/div>\n      <h2 id=\"p-title\">\u2014<\/h2>\n      <div class=\"meta\" id=\"p-meta\"><\/div>\n    <\/div>\n    <div class=\"panel-body\" id=\"p-body\"><\/div>\n  <\/div>\n<\/aside>\n\n<div class=\"tip\" id=\"tip\"><div class=\"t\" id=\"tip-t\">\u2014<\/div><div id=\"tip-n\">\u2014<\/div><\/div>\n\n<button class=\"tweaks-toggle\" id=\"tweaks-toggle\">Tweaks<\/button>\n<aside class=\"tweaks\" id=\"tweaks\">\n  <header>Tweaks <button id=\"tweaks-close\" style=\"background:none;border:none;color:var(--ink-dim);cursor:pointer;font-family:inherit;font-size:14px;line-height:1\">\u00d7<\/button><\/header>\n  <div class=\"body\" id=\"tweaks-body\"><\/div>\n<\/aside>\n\n<script>\n/* ============================================================\n   CHLOE BRAIN GRAPH\n   Single-file visualization. Tries the live backend first,\n   falls back to baked-in mock pages if the API isn't reachable.\n   ============================================================ */\n\nconst TWEAKS = /*EDITMODE-BEGIN*/{\n  \"drift\": 2.2,\n  \"halo\": 0.65,\n  \"edgeFlow\": 1.3,\n  \"depth\": 1,\n  \"edgeStyle\": \"flow\"\n}/*EDITMODE-END*/;\n\n/* ----- mock data: 18 pages, two designated hubs (rag, llm-wiki) ----- */\nconst MOCK = (() => {\n  const pages = [\n    { id: 'entities/karpathy',      type: 'entities',     title: 'Andrej Karpathy' },\n    { id: 'entities/anthropic',     type: 'entities',     title: 'Anthropic' },\n    { id: 'entities/qmd',           type: 'entities',     title: 'qmd' },\n    { id: 'entities/obsidian',      type: 'entities',     title: 'Obsidian' },\n    { id: 'concepts/llm-wiki',      type: 'concepts',     title: 'LLM Wiki' },\n    { id: 'concepts/rag',           type: 'concepts',     title: 'RAG' },\n    { id: 'concepts/embeddings',    type: 'concepts',     title: 'Embeddings' },\n    { id: 'concepts/transformers',  type: 'concepts',     title: 'Transformers' },\n    { id: 'concepts/attention',     type: 'concepts',     title: 'Attention' },\n    { id: 'concepts/fine-tuning',   type: 'concepts',     title: 'Fine-tuning' },\n    { id: 'concepts/wikilinks',     type: 'concepts',     title: 'Wikilinks' },\n    { id: 'sources/karpathy-gist',  type: 'sources',      title: 'Karpathy LLM-Wiki Gist' },\n    { id: 'sources/attn-paper',     type: 'sources',      title: 'Attention Is All You Need' },\n    { id: 'sources/anthropic-blog', type: 'sources',      title: 'Anthropic Blog: Constitutional AI' },\n    { id: 'comparisons/rag-vs-ft',  type: 'comparisons',  title: 'RAG vs Fine-tuning' },\n    { id: 'explorations/vault-arch',type: 'explorations', title: 'Vault Architecture Sketch' },\n    { id: 'ghost/MoE',              type: 'ghost',        title: 'MoE' },\n    { id: 'ghost/diffusion',        type: 'ghost',        title: 'Diffusion' },\n  ];\n  const edges = [\n    ['concepts/llm-wiki','sources/karpathy-gist'],\n    ['concepts/llm-wiki','entities/karpathy'],\n    ['concepts/llm-wiki','concepts/wikilinks'],\n    ['concepts/llm-wiki','entities/obsidian'],\n    ['concepts/llm-wiki','concepts/rag'],\n    ['concepts/llm-wiki','explorations/vault-arch'],\n    ['concepts/llm-wiki','entities/qmd'],\n    ['concepts/rag','concepts/embeddings'],\n    ['concepts/rag','sources/attn-paper'],\n    ['concepts/rag','comparisons/rag-vs-ft'],\n    ['concepts/rag','concepts/fine-tuning'],\n    ['concepts/rag','entities/anthropic'],\n    ['concepts/rag','concepts/transformers'],\n    ['concepts/transformers','concepts/attention'],\n    ['concepts/transformers','sources/attn-paper'],\n    ['concepts/transformers','ghost/MoE'],\n    ['concepts/attention','sources/attn-paper'],\n    ['concepts/fine-tuning','comparisons/rag-vs-ft'],\n    ['concepts/fine-tuning','ghost/diffusion'],\n    ['entities/anthropic','sources/anthropic-blog'],\n    ['entities/karpathy','sources/karpathy-gist'],\n    ['entities/qmd','concepts/wikilinks'],\n    ['explorations/vault-arch','concepts/wikilinks'],\n    ['explorations/vault-arch','entities/obsidian'],\n  ];\n  const inDeg = {}, outDeg = {};\n  pages.forEach(p => { inDeg[p.id] = 0; outDeg[p.id] = 0; });\n  edges.forEach(([s,t]) => { outDeg[s]=(outDeg[s]||0)+1; inDeg[t]=(inDeg[t]||0)+1; });\n  const nodes = pages.map(p => {\n    const ind = inDeg[p.id]||0, outd = outDeg[p.id]||0;\n    return { id: p.id, label: p.title, type: p.type, real: p.type !== 'ghost',\n             in_deg: ind, out_deg: outd, degree: ind+outd,\n             size: 12 + Math.sqrt(ind+outd) * 5 };\n  });\n  return {\n    nodes,\n    edges: edges.map(([s,t])=>({source:s,target:t})),\n    stats: { pages: nodes.filter(n=>n.real).length, edges: edges.length, ghosts: nodes.filter(n=>!n.real).length }\n  };\n})();\n\nconst MOCK_PAGES = {\n  'concepts/llm-wiki': `# LLM Wiki\\n\\nA personal knowledge base built from a folder of markdown files where every source ingested gets broken down into entity, concept, and source pages \u2014 all cross-referenced via wikilinks.\\n\\nProposed by [[entities/karpathy|Andrej Karpathy]] in the [[sources/karpathy-gist|original gist]] \u2014 the [[entities/obsidian|Obsidian]] vault metaphor, but maintained by an LLM instead of a human.\\n\\n## Why\\n\\n- Captures lossy compression of long context\\n- Cross-document retrieval beats per-document\\n- Edges *between* facts are themselves first-class\\n\\n## Key links\\n\\n- [[concepts/wikilinks|Wikilinks]] are the connective tissue\\n- [[concepts/rag|RAG]] is the retrieval substrate\\n- See [[explorations/vault-arch|the vault architecture sketch]] for layout`,\n  'concepts/rag': `# Retrieval-Augmented Generation\\n\\n**RAG** wraps an LLM with a retriever over an external corpus. At query time, top-k relevant chunks are fetched (usually via [[concepts/embeddings|embeddings]]) and stitched into the prompt.\\n\\nCompared to [[concepts/fine-tuning|fine-tuning]]: cheaper to update, easier to attribute, but bounded by retrieval quality. See [[comparisons/rag-vs-ft|the head-to-head]].\\n\\n> Karpathy: a wiki *is* the retrieval index, structured by an LLM.\\n\\n## Stack\\n\\n1. Chunker\\n2. Embedder ([[concepts/embeddings]])\\n3. Vector DB\\n4. Reranker (optional)\\n5. Generator ([[concepts/transformers|transformer]])`,\n  'concepts/embeddings': `# Embeddings\\n\\nDense vector representations of text where geometric distance \u2248 semantic similarity. The substrate underneath [[concepts/rag|RAG]].\\n\\nProduced by encoder models \u2014 often the encoder half of a [[concepts/transformers|transformer]].`,\n  'concepts/transformers': `# Transformers\\n\\nThe architecture introduced in [[sources/attn-paper|Attention Is All You Need]] (2017). Built on stacked self-[[concepts/attention|attention]] layers and feedforward blocks.\\n\\n## Variants\\n- Encoder only (BERT-style)\\n- Decoder only (GPT-style)\\n- Encoder-decoder (T5-style)\\n- [[ghost/MoE|Mixture-of-Experts]] sparsifies the FFN`,\n  'concepts/attention': `# Attention\\n\\nThe primitive that lets a model dynamically weight context. Defined in [[sources/attn-paper|Vaswani et al. 2017]] as scaled dot-product attention.\\n\\n\\`\\`\\`\\nAttention(Q, K, V) = softmax(QK^T / sqrt(d_k)) V\\n\\`\\`\\``,\n  'concepts/fine-tuning': `# Fine-tuning\\n\\nUpdating a pretrained model's weights on a task-specific corpus. Trades flexibility for capability \u2014 see [[comparisons/rag-vs-ft|RAG vs FT]] for tradeoffs.\\n\\nRelated: [[ghost/diffusion|diffusion fine-tuning]].`,\n  'concepts/wikilinks': `# Wikilinks\\n\\nThe \\`[[double-bracket]]\\` syntax popularized by [[entities/obsidian|Obsidian]]. In Chloe's wiki, every wikilink becomes a graph edge.\\n\\nGhost links \u2014 links to pages that don't exist yet \u2014 are still rendered as nodes (faintly) so the graph reveals where the wiki is *thin*.`,\n  'entities/karpathy': `# Andrej Karpathy\\n\\nFormer director of AI at Tesla, founding member of OpenAI. Author of the [[sources/karpathy-gist|LLM Wiki gist]] that inspired this whole [[concepts/llm-wiki|wiki structure]].`,\n  'entities/anthropic': `# Anthropic\\n\\nAI safety lab. Builders of Claude. Published the constitutional-AI approach in [[sources/anthropic-blog|the blog post]] cited in the [[concepts/rag|RAG]] entry.`,\n  'entities/qmd': `# qmd\\n\\nMe. Builder of Chloe. Notes here cross-link with [[concepts/wikilinks|wikilink syntax]] and feed back into the wiki on every ingest.`,\n  'entities/obsidian': `# Obsidian\\n\\nLocal-first markdown editor whose vault graph is the visual ancestor of this view \u2014 though Chloe's brain is meant to feel less filing-cabinet, more *living constellation*.`,\n  'sources/karpathy-gist': `# Karpathy LLM-Wiki Gist\\n\\n*X / Twitter, 2024.*\\n\\nThe origin proposal: an LLM-maintained wiki of entities, concepts, and sources, all cross-linked. Read in full at the gist URL.`,\n  'sources/attn-paper': `# Attention Is All You Need\\n\\n*Vaswani et al., 2017.*\\n\\nThe paper that introduced [[concepts/transformers|the transformer]]. Replaces recurrence and convolutions with stacked self-[[concepts/attention|attention]].`,\n  'sources/anthropic-blog': `# Anthropic Blog \u2014 Constitutional AI\\n\\nA framework for aligning models via a written constitution + RLAIF. Cited from the [[concepts/rag|RAG]] entry as an example of in-context steering.`,\n  'comparisons/rag-vs-ft': `# RAG vs Fine-tuning\\n\\n| Axis | [[concepts/rag\\\\|RAG]] | [[concepts/fine-tuning\\\\|FT]] |\\n|---|---|---|\\n| Cost to update | low | high |\\n| Attribution | strong | weak |\\n| Latency | higher | lower |\\n| Domain shift | excellent | rigid |\\n\\nUsually: RAG first, FT only when retrieval saturates.`,\n  'explorations/vault-arch': `# Vault Architecture Sketch\\n\\nMy take on a directory layout for the [[concepts/llm-wiki|wiki]]:\\n\\n\\`\\`\\`\\nwiki/\\n  entities/\\n  concepts/\\n  sources/\\n  comparisons/\\n  explorations/\\n  index.md\\n  log.md\\n\\`\\`\\`\\n\\nWikilinks resolve relative to \\`wiki/\\`. The graph view treats every \\`[[link]]\\` as an edge. See [[concepts/wikilinks]].`,\n  'ghost/MoE': null,\n  'ghost/diffusion': null,\n};\n\n/* ----- type styling: cyan family with tiny hue shifts ----- */\nconst TYPE_STYLE = {\n  entities:     { hue: 195, sat: 0.68, lum: 0.78, label: 'Entity'      },\n  concepts:     { hue: 178, sat: 0.74, lum: 0.74, label: 'Concept'     },\n  sources:      { hue: 205, sat: 0.62, lum: 0.72, label: 'Source'      },\n  comparisons:  { hue: 168, sat: 0.65, lum: 0.70, label: 'Comparison'  },\n  explorations: { hue: 186, sat: 0.70, lum: 0.76, label: 'Exploration' },\n  ghost:        { hue: 218, sat: 0.18, lum: 0.55, label: 'Ghost'       },\n};\n\n/* helpers */\nconst hsla = (h,s,l,a=1) => `hsla(${h}, ${s*100}%, ${l*100}%, ${a})`;\nconst lerp = (a,b,t) => a + (b-a)*t;\nconst clamp = (v,a,b) => Math.max(a, Math.min(b, v));\n\n/* ============================================================\n   STATE\n   ============================================================ */\nlet G = { nodes: [], edges: [], stats: {} };\nlet nodeById = new Map();\nlet neighborMap = new Map(); // id -> Set(neighbor ids)\nlet hovered = null;\nlet selected = null;\nlet dragging = null;\nlet pointer = { x: 0, y: 0, screenX: 0, screenY: 0, downX: 0, downY: 0, isDown: false, didDrag: false };\nlet tStart = performance.now();\nlet zoomTransform = d3.zoomIdentity.translate(0, 0).scale(1);\n\n/* canvases */\nconst cStars = document.getElementById('c-stars');\nconst cEdges = document.getElementById('c-edges');\nconst cHalos = document.getElementById('c-halos');\nconst cOrbs  = document.getElementById('c-orbs');\nconst ctxStars = cStars.getContext('2d');\nconst ctxEdges = cEdges.getContext('2d');\nconst ctxHalos = cHalos.getContext('2d');\nconst ctxOrbs  = cOrbs.getContext('2d');\n\nlet dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));\nlet W = 0, H = 0;\n\nfunction resize() {\n  W = window.innerWidth; H = window.innerHeight;\n  for (const c of [cStars, cEdges, cHalos, cOrbs]) {\n    c.width = Math.floor(W * dpr); c.height = Math.floor(H * dpr);\n    c.style.width = W + 'px'; c.style.height = H + 'px';\n    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);\n  }\n  initStars();\n}\nwindow.addEventListener('resize', resize);\n\n/* ============================================================\n   STARFIELD (parallax)\n   ============================================================ */\nlet stars = [];\nfunction initStars() {\n  const target = Math.floor(W * H / 9000);\n  stars = new Array(target).fill(0).map(() => ({\n    x: Math.random() * W,\n    y: Math.random() * H,\n    z: Math.random() * 0.85 + 0.15, // depth 0.15-1\n    r: Math.random() * 1.2 + 0.2,\n    tw: Math.random() * Math.PI * 2,\n  }));\n}\n\nfunction drawStars(t) {\n  const ctx = ctxStars;\n  ctx.clearRect(0, 0, W, H);\n  // slow parallax pan tied to time, plus zoom-derived bias\n  const px = Math.sin(t * 0.00007) * 30;\n  const py = Math.cos(t * 0.00009) * 18;\n  const zk = (zoomTransform.k - 1) * 18 * TWEAKS.depth;\n  const tx = zoomTransform.x * 0.04 * TWEAKS.depth;\n  const ty = zoomTransform.y * 0.04 * TWEAKS.depth;\n  for (const s of stars) {\n    const ox = (s.x + (px + tx) * s.z + zk * (s.x/W - 0.5)) % W;\n    const oy = (s.y + (py + ty) * s.z + zk * (s.y/H - 0.5)) % H;\n    const x = (ox + W) % W;\n    const y = (oy + H) % H;\n    const tw = 0.35 + 0.4 * (0.5 + 0.5 * Math.sin(t * 0.0014 + s.tw));\n    const a = clamp(0.18 + s.z * 0.55 * tw, 0, 1);\n    ctx.fillStyle = `rgba(180, 220, 240, ${a})`;\n    ctx.fillRect(x, y, s.r, s.r);\n  }\n}\n\n/* ============================================================\n   GRAPH LAYOUT\n   ============================================================ */\nfunction buildLayout() {\n  // build d3-force simulation, run for fixed iterations, then freeze.\n  const nodes = G.nodes.map(n => ({ ...n }));\n  const edges = G.edges.map(e => ({\n    source: typeof e.source === 'string' ? e.source : e.source.id,\n    target: typeof e.target === 'string' ? e.target : e.target.id\n  }));\n  const cx = W/2, cy = H/2;\n  nodes.forEach(n => {\n    n.x = cx + (Math.random()-0.5) * 200;\n    n.y = cy + (Math.random()-0.5) * 200;\n  });\n  const sim = d3.forceSimulation(nodes)\n    .force('link', d3.forceLink(edges).id(d => d.id).distance(d => 70 + 6 * Math.sqrt((d.source.degree||1)+(d.target.degree||1))).strength(0.55))\n    .force('charge', d3.forceManyBody().strength(d => -260 - 14*(d.degree||0)))\n    .force('center', d3.forceCenter(cx, cy).strength(0.04))\n    .force('collide', d3.forceCollide().radius(d => (d.size||14) + 12).strength(0.85))\n    .force('x', d3.forceX(cx).strength(0.025))\n    .force('y', d3.forceY(cy).strength(0.04))\n    .stop();\n\n  for (let i = 0; i < 320; i++) sim.tick();\n\n  // Freeze layout. Add anchors + Lissajous params.\n  const ph = (s) => Math.sin(s) * 9301.3 + Math.cos(s*1.7) * 2371.7;\n  nodes.forEach((n,i) => {\n    const seed = i * 0.917 + n.id.length * 0.31;\n    n.ax = n.x; n.ay = n.y; // anchor\n    n.fx = 1.0 + Math.abs(ph(seed*1.1)) % 0.7;        // freq x\n    n.fy = 1.2 + Math.abs(ph(seed*1.7+1.3)) % 0.7;    // freq y\n    n.px = (ph(seed) % Math.PI*2);                    // phase x\n    n.py = (ph(seed*2.3) % Math.PI*2);                // phase y\n    // amplitude: less for hubs, more for quiet nodes\n    const inv = 1 / Math.sqrt(1 + (n.degree||0));\n    n.ampx = lerp(14, 38, inv);\n    n.ampy = lerp(10, 32, inv);\n  });\n  G.nodes = nodes;\n  G.edges = edges;\n  nodeById = new Map(nodes.map(n => [n.id, n]));\n  neighborMap = new Map(nodes.map(n => [n.id, new Set()]));\n  edges.forEach(e => {\n    const sId = e.source.id || e.source, tId = e.target.id || e.target;\n    neighborMap.get(sId)?.add(tId);\n    neighborMap.get(tId)?.add(sId);\n  });\n}\n\n/* compute live position with drift */\nfunction nodePos(n, t) {\n  const k = TWEAKS.drift;\n  const dx = Math.sin(t * 0.00012 * n.fx + n.px) * n.ampx * k;\n  const dy = Math.cos(t * 0.00014 * n.fy + n.py) * n.ampy * k;\n  // tiny breathing in size\n  const breath = 1 + Math.sin(t * 0.0009 + n.px) * 0.03;\n  return { x: n.ax + dx, y: n.ay + dy, breath };\n}\n\n/* world -> screen */\nfunction toScreen(wx, wy) {\n  return [zoomTransform.applyX(wx), zoomTransform.applyY(wy)];\n}\nfunction toWorld(sx, sy) {\n  return zoomTransform.invert([sx, sy]);\n}\n\n/* ============================================================\n   ORB RENDERING \u2014 5 layers per node\n   ============================================================ */\nfunction drawOrb(ctx, x, y, r, style, lum, pulse, alphaMul) {\n  const { hue, sat } = style;\n  const hi = hsla(hue, sat*0.4, 0.96, 1.0);          // near-white highlight\n  const mid = hsla(hue, sat, lum, 1.0);\n  const dim = hsla(hue, sat*0.7, Math.max(0.18, lum*0.35), 1.0);\n  const dark = hsla(hue, sat*0.6, Math.max(0.08, lum*0.18), 1.0);\n\n  const a = alphaMul ?? 1;\n\n  // 1. atmosphere ring (outside body)\n  ctx.save();\n  ctx.globalAlpha = 0.55 * a;\n  ctx.strokeStyle = hsla(hue, sat, Math.min(0.85, lum + 0.1), 0.55);\n  ctx.lineWidth = 1.2;\n  ctx.beginPath(); ctx.arc(x, y, r * 1.06, 0, Math.PI*2); ctx.stroke();\n  ctx.restore();\n\n  // 2. body \u2014 radial gradient with off-axis center for \"lit from upper-left\"\n  const ox = x - r*0.32, oy = y - r*0.42;\n  const grd = ctx.createRadialGradient(ox, oy, r*0.05, x, y, r);\n  grd.addColorStop(0.0, hi);\n  grd.addColorStop(0.18, hsla(hue, sat*0.7, Math.min(0.92, lum + 0.18), 1));\n  grd.addColorStop(0.55, mid);\n  grd.addColorStop(0.85, dim);\n  grd.addColorStop(1.0, dark);\n  ctx.save();\n  ctx.globalAlpha = a;\n  ctx.fillStyle = grd;\n  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();\n\n  // 3. specular highlight (small bright spot)\n  const hg = ctx.createRadialGradient(ox, oy, 0, ox, oy, r*0.55);\n  hg.addColorStop(0, `rgba(255,255,255,${0.55 * a})`);\n  hg.addColorStop(0.4, `rgba(255,255,255,${0.06 * a})`);\n  hg.addColorStop(1, 'rgba(255,255,255,0)');\n  ctx.fillStyle = hg;\n  ctx.beginPath(); ctx.arc(ox, oy, r*0.55, 0, Math.PI*2); ctx.fill();\n\n  // 4. inner concentric ring (very subtle)\n  ctx.globalAlpha = 0.18 * a;\n  ctx.strokeStyle = hsla(hue, sat*0.5, 0.95, 0.4);\n  ctx.lineWidth = 0.7;\n  ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI*2); ctx.stroke();\n\n  // 5. shadow arc opposite the highlight\n  ctx.globalAlpha = 0.28 * a;\n  ctx.strokeStyle = 'rgba(0,0,0,0.5)';\n  ctx.lineWidth = 1.4;\n  ctx.beginPath();\n  ctx.arc(x, y, r*0.94, Math.PI*0.15, Math.PI*0.85);\n  ctx.stroke();\n\n  ctx.restore();\n}\n\n/* halo on screen-blend canvas */\nfunction drawHalo(ctx, x, y, r, style, lum, intensity, alphaMul) {\n  const { hue, sat } = style;\n  const grd = ctx.createRadialGradient(x, y, r*0.2, x, y, r * (4.5 * intensity));\n  const peak = Math.min(0.95, 0.34 + lum * 0.45 + intensity * 0.18);\n  grd.addColorStop(0.0, hsla(hue, sat, Math.min(0.85, lum + 0.05), peak * (alphaMul||1)));\n  grd.addColorStop(0.35, hsla(hue, sat, lum, 0.18 * (alphaMul||1)));\n  grd.addColorStop(1.0, hsla(hue, sat, lum*0.4, 0));\n  ctx.fillStyle = grd;\n  ctx.beginPath();\n  ctx.arc(x, y, r * (4.5 * intensity), 0, Math.PI*2);\n  ctx.fill();\n}\n\n/* ============================================================\n   MAIN RENDER\n   ============================================================ */\nlet lastFrame = performance.now();\nlet frameTimes = [];\nlet positionsCache = new Map();\n\nfunction render() {\n  const now = performance.now();\n  const t = now - tStart;\n\n  // FPS\n  const dt = now - lastFrame;\n  lastFrame = now;\n  frameTimes.push(dt);\n  if (frameTimes.length > 30) frameTimes.shift();\n  const avg = frameTimes.reduce((a,b)=>a+b,0) / frameTimes.length;\n\n  drawStars(t);\n\n  // compute positions in screen space once\n  positionsCache.clear();\n  const k = zoomTransform.k;\n  for (const n of G.nodes) {\n    const pos = nodePos(n, t);\n    const [sx, sy] = toScreen(pos.x, pos.y);\n    positionsCache.set(n.id, { sx, sy, breath: pos.breath, wx: pos.x, wy: pos.y });\n  }\n\n  // edges\n  ctxEdges.clearRect(0, 0, W, H);\n  ctxEdges.lineCap = 'round';\n  for (const e of G.edges) {\n    const sId = e.source.id || e.source, tId = e.target.id || e.target;\n    const a = positionsCache.get(sId), b = positionsCache.get(tId);\n    if (!a || !b) continue;\n    const sn = nodeById.get(sId), tn = nodeById.get(tId);\n    const isHi = (hovered && (hovered.id === sId || hovered.id === tId)) ||\n                 (selected && (selected.id === sId || selected.id === tId));\n    const isReal = sn.real && tn.real;\n\n    const grd = ctxEdges.createLinearGradient(a.sx, a.sy, b.sx, b.sy);\n    const sStyle = TYPE_STYLE[sn.type], tStyle = TYPE_STYLE[tn.type];\n    const baseAlpha = isHi ? 0.85 : (isReal ? 0.32 : 0.16);\n    grd.addColorStop(0, hsla(sStyle.hue, sStyle.sat*0.7, sStyle.lum, baseAlpha));\n    grd.addColorStop(1, hsla(tStyle.hue, tStyle.sat*0.7, tStyle.lum, baseAlpha));\n    ctxEdges.strokeStyle = grd;\n    ctxEdges.lineWidth = isHi ? 1.6 : 0.9;\n    ctxEdges.beginPath();\n    ctxEdges.moveTo(a.sx, a.sy);\n    ctxEdges.lineTo(b.sx, b.sy);\n    ctxEdges.stroke();\n\n    // edge particles for highlighted edges (cheap: only on hover/select)\n    if (isHi && TWEAKS.edgeStyle === 'flow' && TWEAKS.edgeFlow > 0) {\n      const len = Math.hypot(b.sx-a.sx, b.sy-a.sy);\n      const speed = 0.00018 * TWEAKS.edgeFlow;\n      const phase = (t * speed) % 1;\n      const count = Math.max(1, Math.floor(len / 70));\n      for (let i = 0; i < count; i++) {\n        const p = (phase + i / count) % 1;\n        const px = a.sx + (b.sx - a.sx) * p;\n        const py = a.sy + (b.sy - a.sy) * p;\n        ctxEdges.fillStyle = `rgba(184,245,255,${0.85 * (1 - Math.abs(p-0.5)*0.6)})`;\n        ctxEdges.beginPath();\n        ctxEdges.arc(px, py, 1.6, 0, Math.PI*2);\n        ctxEdges.fill();\n      }\n    }\n  }\n\n  // halos (additive)\n  ctxHalos.clearRect(0, 0, W, H);\n  for (const n of G.nodes) {\n    const p = positionsCache.get(n.id);\n    const style = TYPE_STYLE[n.type];\n    const r = (n.size || 14) * k * 0.6;\n    if (r < 1) continue;\n    const lum = lerp(style.lum, Math.min(0.95, style.lum + 0.1), Math.tanh((n.degree||0) / 4));\n    // pulse stronger for higher degree\n    const pulseAmp = 0.18 + 0.5 * clamp((n.degree||0)/8, 0, 1);\n    const pulsePeriod = lerp(2.6, 4.6, clamp((n.degree||0)/8, 0, 1)) * 1000;\n    const pulse = 0.78 + Math.sin(t / pulsePeriod * Math.PI*2 + n.px) * pulseAmp;\n    const intensity = (n.real ? 1.0 : 0.45) * pulse * TWEAKS.halo;\n\n    const dim = (selected && !isNeighbor(selected, n.id) && selected.id !== n.id) ? 0.28 : 1.0;\n    drawHalo(ctxHalos, p.sx, p.sy, r, style, lum, intensity, n.real ? 1 * dim : 0.55 * dim);\n  }\n\n  // orbs\n  ctxOrbs.clearRect(0, 0, W, H);\n  for (const n of G.nodes) {\n    const p = positionsCache.get(n.id);\n    const style = TYPE_STYLE[n.type];\n    const baseR = (n.size || 14) * k * 0.6 * p.breath;\n    const r = baseR;\n    const lum = lerp(style.lum, Math.min(0.95, style.lum + 0.12), Math.tanh((n.degree||0) / 4));\n    const dim = (selected && !isNeighbor(selected, n.id) && selected.id !== n.id) ? 0.32 : 1.0;\n    const alpha = (n.real ? 1 : 0.62) * dim;\n    drawOrb(ctxOrbs, p.sx, p.sy, r, style, lum, 1, alpha);\n\n    // hover ring\n    if (hovered && hovered.id === n.id) {\n      ctxOrbs.save();\n      ctxOrbs.strokeStyle = `rgba(184,245,255,0.9)`;\n      ctxOrbs.lineWidth = 1.2;\n      ctxOrbs.setLineDash([3, 4]);\n      ctxOrbs.lineDashOffset = -t * 0.04;\n      ctxOrbs.beginPath();\n      ctxOrbs.arc(p.sx, p.sy, r + 6, 0, Math.PI*2);\n      ctxOrbs.stroke();\n      ctxOrbs.restore();\n    }\n    // selected ring\n    if (selected && selected.id === n.id) {\n      ctxOrbs.save();\n      ctxOrbs.strokeStyle = `rgba(184,245,255,1)`;\n      ctxOrbs.lineWidth = 1.4;\n      ctxOrbs.beginPath();\n      ctxOrbs.arc(p.sx, p.sy, r + 9, 0, Math.PI*2);\n      ctxOrbs.stroke();\n      ctxOrbs.strokeStyle = `rgba(88,230,255,0.45)`;\n      ctxOrbs.lineWidth = 0.8;\n      ctxOrbs.beginPath();\n      ctxOrbs.arc(p.sx, p.sy, r + 14, 0, Math.PI*2);\n      ctxOrbs.stroke();\n      ctxOrbs.restore();\n    }\n\n    // labels (only for hubs / hovered / selected, to keep clean)\n    const showLabel = (n.degree >= 4 && k > 0.7) || (hovered && hovered.id === n.id) || (selected && selected.id === n.id);\n    if (showLabel && n.real) {\n      ctxOrbs.save();\n      ctxOrbs.font = '10px \"Share Tech Mono\", monospace';\n      ctxOrbs.textAlign = 'center';\n      ctxOrbs.textBaseline = 'top';\n      const txt = n.label.toUpperCase();\n      const tw = ctxOrbs.measureText(txt).width;\n      ctxOrbs.fillStyle = 'rgba(2,8,12,0.7)';\n      ctxOrbs.fillRect(p.sx - tw/2 - 6, p.sy + r + 6, tw + 12, 16);\n      ctxOrbs.strokeStyle = 'rgba(88,230,255,0.4)';\n      ctxOrbs.lineWidth = 0.6;\n      ctxOrbs.strokeRect(p.sx - tw/2 - 6, p.sy + r + 6, tw + 12, 16);\n      ctxOrbs.fillStyle = 'rgba(184,245,255,0.95)';\n      ctxOrbs.fillText(txt, p.sx, p.sy + r + 9);\n      ctxOrbs.restore();\n    }\n  }\n\n  // telemetry\n  document.getElementById('t-fps').textContent = (1000/Math.max(1,avg)).toFixed(0);\n  document.getElementById('t-frame').textContent = avg.toFixed(1) + ' ms/f';\n  document.getElementById('t-zoom').textContent = k.toFixed(2) + '\u00d7';\n  const w = toWorld(pointer.x, pointer.y);\n  document.getElementById('t-cursor').textContent = `${Math.round(w[0])} \u00b7 ${Math.round(w[1])}`;\n  document.getElementById('t-hover').textContent = hovered ? hovered.label : '\u2014 none \u2014';\n  document.getElementById('t-hover').style.color = hovered ? 'var(--cyan-bright)' : 'var(--ink-dim)';\n\n  requestAnimationFrame(render);\n}\n\nfunction isNeighbor(node, otherId) {\n  if (!node) return false;\n  return neighborMap.get(node.id)?.has(otherId);\n}\n\n/* ============================================================\n   INTERACTION\n   ============================================================ */\nconst overlay = cOrbs;\n\nfunction pickNode(sx, sy) {\n  // search in reverse for top-most\n  if (!window.__chloeFirstClick) { window.__chloeFirstClick = true; console.log(\"[chloe-graph] first pickNode:\", sx, sy, \"nodes=\", G && G.nodes && G.nodes.length, \"cache=\", positionsCache && positionsCache.size); }\n  for (let i = G.nodes.length - 1; i >= 0; i--) {\n    const n = G.nodes[i];\n    const p = positionsCache.get(n.id);\n    if (!p) continue;\n    const r = (n.size || 14) * zoomTransform.k * 0.6 + 4;\n    if ((p.sx - sx)**2 + (p.sy - sy)**2 < r*r) return n;\n  }\n  return null;\n}\n\noverlay.addEventListener('pointermove', (e) => {\n  pointer.x = e.clientX; pointer.y = e.clientY;\n  if (dragging) {\n    const w = toWorld(e.clientX, e.clientY);\n    dragging.ax = w[0]; dragging.ay = w[1];\n    return;\n  }\n  if (pointer.isDown) {\n    if (Math.abs(e.clientX - pointer.downX) + Math.abs(e.clientY - pointer.downY) > 4) pointer.didDrag = true;\n    return;\n  }\n  const n = pickNode(e.clientX, e.clientY);\n  if (n !== hovered) {\n    hovered = n;\n    overlay.classList.toggle('over-node', !!n);\n    if (n) {\n      const p = positionsCache.get(n.id);\n      const tip = document.getElementById('tip');\n      tip.style.left = p.sx + 'px';\n      tip.style.top = p.sy + 'px';\n      document.getElementById('tip-t').textContent = TYPE_STYLE[n.type].label + ' \u00b7 deg ' + n.degree;\n      document.getElementById('tip-n').textContent = n.label;\n      tip.classList.add('show');\n    } else {\n      document.getElementById('tip').classList.remove('show');\n    }\n  } else if (n) {\n    const p = positionsCache.get(n.id);\n    const tip = document.getElementById('tip');\n    tip.style.left = p.sx + 'px';\n    tip.style.top = p.sy + 'px';\n  }\n});\n\noverlay.addEventListener('pointerdown', (e) => {\n  pointer.isDown = true; pointer.didDrag = false;\n  pointer.downX = e.clientX; pointer.downY = e.clientY;\n  const n = pickNode(e.clientX, e.clientY);\n  if (n) {\n    dragging = n;\n    overlay.classList.add('dragging');\n    overlay.setPointerCapture(e.pointerId);\n  }\n});\n\noverlay.addEventListener('pointerup', (e) => {\n  // Patched: a tap on an orb sets `dragging` in pointerdown but doesn't\n  // actually move (didDrag stays false). Original logic only opened the\n  // panel for taps on empty space because !dragging was false. Treat any\n  // pointerup with no drag as a click \u2014 use `dragging` if set (the node\n  // we pressed on), else hit-test fresh.\n  if (!pointer.didDrag) {\n    const n = dragging || pickNode(e.clientX, e.clientY);\n    if (n) selectNode(n);\n    else { selected = null; closePanel(); }\n  }\n  if (dragging) { dragging = null; overlay.classList.remove('dragging'); }\n  pointer.isDown = false;\n});\noverlay.addEventListener('pointercancel', () => { dragging = null; pointer.isDown = false; overlay.classList.remove('dragging'); });\n\noverlay.addEventListener('pointerleave', () => {\n  hovered = null;\n  document.getElementById('tip').classList.remove('show');\n  overlay.classList.remove('over-node');\n});\n\n/* ZOOM/PAN \u2014 d3-zoom only on canvas; we do the math, no DOM transform */\nconst zoomBehavior = d3.zoom()\n  .scaleExtent([0.25, 4])\n  .filter((event) => {\n    // disallow zoom-on-pickable-node-drag (we handle it ourselves)\n    if (event.type === 'mousedown' || event.type === 'pointerdown' || event.type === 'touchstart') {\n      const n = pickNode(event.clientX, event.clientY);\n      if (n) return false;\n    }\n    return !event.button;\n  })\n  .on('zoom', (ev) => { zoomTransform = ev.transform; });\nd3.select(overlay).call(zoomBehavior);\n\n/* ============================================================\n   PANEL\n   ============================================================ */\nfunction selectNode(n) {\n  console.log(\"[chloe-graph] selectNode:\", n && n.id, n && n.type);\n  selected = n;\n  const panel = document.getElementById('panel');\n  panel.classList.add('open');\n  const style = TYPE_STYLE[n.type];\n  panel.style.setProperty('--cl-hi', hsla(style.hue, style.sat*0.4, 0.95, 1));\n  panel.style.setProperty('--cl-lo', hsla(style.hue, style.sat, style.lum, 1));\n  panel.style.setProperty('--cl-glow', hsla(style.hue, style.sat, style.lum, 0.7));\n  document.getElementById('p-type').querySelector('span').textContent = style.label.toUpperCase() + ' \u00b7 ' + n.id.split('/')[0];\n  document.getElementById('p-title').textContent = n.label;\n  document.getElementById('p-meta').innerHTML = `\n    <span>ID <b>${n.id}<\/b><\/span>\n    <span>IN <b>${n.in_deg||0}<\/b><\/span>\n    <span>OUT <b>${n.out_deg||0}<\/b><\/span>\n    <span>DEG <b>${n.degree||0}<\/b><\/span>\n    ${n.real ? '' : '<span style=\"color:var(--ghost)\"><b>GHOST<\/b><\/span>'}\n  `;\n  loadPage(n);\n}\n\nfunction closePanel() {\n  document.getElementById('panel').classList.remove('open');\n  selected = null;\n}\ndocument.getElementById('panel-close').addEventListener('click', closePanel);\n\n// Brute-force X close: bind on pointerdown AND click, both via delegation\n// and directly. Also force inline-style hide so nothing can override the\n// transition. Logs at every step so we can see what's actually happening.\nfunction _forceClosePanel(label) {\n  console.log('[chloe-graph] _forceClosePanel called from', label);\n  const panel = document.getElementById('panel');\n  if (!panel) { console.log('  no #panel element'); return; }\n  panel.classList.remove('open');\n  panel.style.transform = 'translateX(100%)';\n  panel.style.opacity = '0';\n  panel.style.pointerEvents = 'none';\n  if (typeof selected !== 'undefined') selected = null;\n  // Clear the inline style after the transition so .open can re-apply later.\n  setTimeout(() => {\n    panel.style.transform = '';\n    panel.style.opacity = '';\n    panel.style.pointerEvents = '';\n  }, 360);\n}\nfunction _isCloseTarget(t) {\n  return t && (t.id === 'panel-close' ||\n               (t.closest && t.closest('#panel-close')));\n}\n['click','pointerdown','pointerup','mousedown'].forEach((evt) => {\n  document.addEventListener(evt, (ev) => {\n    if (_isCloseTarget(ev.target)) {\n      console.log('[chloe-graph] X event:', evt);\n      _forceClosePanel(evt);\n      ev.stopPropagation();\n      ev.preventDefault();\n    }\n  }, true);\n});\n// Direct binding too \u2014 defensive in case the document delegation misses.\nconst _xbtn = document.getElementById('panel-close');\nif (_xbtn) {\n  _xbtn.addEventListener('pointerdown', (ev) => {\n    console.log('[chloe-graph] X pointerdown direct');\n    _forceClosePanel('direct-pointerdown');\n    ev.stopPropagation();\n    ev.preventDefault();\n  }, true);\n}\ndocument.getElementById('esc-btn').addEventListener('click', () => {\n  // in real Chloe, this signals the parent HUD; here we just close the panel.\n  if (selected) closePanel();\n  window.parent && window.parent !== window && window.parent.postMessage({type:'brain-close'}, '*');\n});\n\nwindow.addEventListener('keydown', (e) => {\n  if (e.key === 'Escape') {\n    if (selected) { closePanel(); return; }\n    window.parent && window.parent !== window && window.parent.postMessage({type:'brain-close'}, '*');\n  }\n});\n\nasync function loadPage(n) {\n  const body = document.getElementById('p-body');\n  if (!n.real) {\n    body.innerHTML = `<p style=\"color:var(--ghost);font-style:italic\">No page exists for <code>${n.id}<\/code> yet \u2014 this is a ghost link. The wiki references it but the file hasn't been written.<\/p>\n      <p>Pages that link to it:<\/p>\n      <ul>${[...neighborMap.get(n.id)].map(id => {\n        const nn = nodeById.get(id);\n        return `<li><a class=\"wikilink\" data-id=\"${id}\">${nn ? nn.label : id}<\/a><\/li>`;\n      }).join('')}<\/ul>`;\n    bindWikilinks();\n    return;\n  }\n  body.innerHTML = `<p style=\"color:var(--ink-dim)\">\u2026loading ${n.id}.md<\/p>`;\n  let md = null;\n  try {\n    const r = await fetch(`/api/brain/page?p=${encodeURIComponent(n.id + '.md')}`, { cache: 'no-store' });\n    if (r.ok) {\n      const j = await r.json();\n      if (j.ok && j.text) md = j.text;\n    }\n  } catch (_) {}\n  if (md == null) md = MOCK_PAGES[n.id] || `# ${n.label}\\n\\n*No page content available.*`;\n  // render: convert [[wikilinks]] before markdown\n  const transformed = md.replace(/\\[\\[([^\\]|\\\\]+)(?:\\|([^\\]]+))?\\]\\]/g, (m, target, label) => {\n    const id = target.trim();\n    const exists = nodeById.has(id);\n    const cls = exists && nodeById.get(id).real ? 'wikilink' : 'wikilink ghost';\n    return `<a class=\"${cls}\" data-id=\"${id}\">${(label || id.split('/').pop() || id).trim()}<\/a>`;\n  });\n  body.innerHTML = window.marked ? window.marked.parse(transformed) : `<pre>${transformed}<\/pre>`;\n  bindWikilinks();\n  body.scrollTop = 0;\n}\n\nfunction bindWikilinks() {\n  document.querySelectorAll('#p-body .wikilink').forEach(a => {\n    a.addEventListener('click', (e) => {\n      e.preventDefault();\n      const id = a.getAttribute('data-id');\n      const n = nodeById.get(id);\n      if (n) selectNode(n);\n    });\n  });\n}\n\n/* ============================================================\n   STATS / LEGEND\n   ============================================================ */\nfunction renderStats() {\n  const real = G.nodes.filter(n => n.real);\n  const hubs = real.filter(n => (n.degree||0) >= 4);\n  document.getElementById('s-pages').textContent = real.length;\n  document.getElementById('s-links').textContent = G.edges.length;\n  document.getElementById('s-hubs').textContent = hubs.length;\n  document.getElementById('s-ghosts').textContent = G.nodes.filter(n => !n.real).length;\n}\n\nfunction renderLegend() {\n  const types = ['entities','concepts','sources','comparisons','explorations','ghost'];\n  const labels = { entities:'Entity', concepts:'Concept', sources:'Source', comparisons:'Compare', explorations:'Explore', ghost:'Ghost' };\n  const root = document.getElementById('legend');\n  // keep label, append items\n  types.forEach(t => {\n    const s = TYPE_STYLE[t];\n    const span = document.createElement('span');\n    span.className = 'item';\n    span.style.setProperty('--cl-hi', hsla(s.hue, s.sat*0.4, 0.95, 1));\n    span.style.setProperty('--cl-lo', hsla(s.hue, s.sat, s.lum, 1));\n    span.style.setProperty('--cl-glow', hsla(s.hue, s.sat, s.lum, 0.7));\n    span.innerHTML = `<i><\/i><span class=\"ll\">${labels[t]}<\/span>`;\n    root.appendChild(span);\n  });\n}\n\n/* ============================================================\n   TWEAKS\n   ============================================================ */\nfunction buildTweaks() {\n  const body = document.getElementById('tweaks-body');\n  const slider = (key, min, max, step, label, fmt) => {\n    const wrap = document.createElement('label');\n    wrap.innerHTML = `<span>${label}<\/span><span class=\"v\">${fmt(TWEAKS[key])}<\/span><input type=\"range\" min=\"${min}\" max=\"${max}\" step=\"${step}\" value=\"${TWEAKS[key]}\" />`;\n    body.appendChild(wrap);\n    const input = wrap.querySelector('input');\n    const v = wrap.querySelector('.v');\n    input.addEventListener('input', () => {\n      TWEAKS[key] = parseFloat(input.value);\n      v.textContent = fmt(TWEAKS[key]);\n      persist();\n    });\n  };\n  slider('drift', 0, 2.5, 0.05, 'Drift Amount', x => x.toFixed(2) + '\u00d7');\n  slider('halo', 0.2, 2, 0.05, 'Halo Intensity', x => x.toFixed(2) + '\u00d7');\n  slider('edgeFlow', 0, 2, 0.05, 'Edge Flow', x => x.toFixed(2) + '\u00d7');\n  slider('depth', 0, 2, 0.05, 'BG Parallax', x => x.toFixed(2) + '\u00d7');\n\n  // edge style segmented\n  const seg = document.createElement('label');\n  seg.innerHTML = `<span>Edge Style<\/span><span class=\"v\">\u2014<\/span>\n    <div class=\"seg\" style=\"grid-column:1/-1\">\n      <button data-v=\"flow\">Flow<\/button>\n      <button data-v=\"static\">Static<\/button>\n    <\/div>`;\n  body.appendChild(seg);\n  const btns = seg.querySelectorAll('button');\n  btns.forEach(b => {\n    b.classList.toggle('on', b.dataset.v === TWEAKS.edgeStyle);\n    b.addEventListener('click', () => {\n      TWEAKS.edgeStyle = b.dataset.v;\n      btns.forEach(x => x.classList.toggle('on', x.dataset.v === TWEAKS.edgeStyle));\n      persist();\n    });\n  });\n}\n\nfunction persist() {\n  try {\n    window.parent && window.parent !== window &&\n      window.parent.postMessage({type:'__edit_mode_set_keys', edits: TWEAKS}, '*');\n  } catch (_) {}\n}\n\n/* tweaks open/close + edit-mode handshake */\nconst tweaksEl = document.getElementById('tweaks');\nconst tweaksToggle = document.getElementById('tweaks-toggle');\nfunction openTweaks(){ tweaksEl.classList.add('show'); requestAnimationFrame(()=>tweaksEl.classList.add('open')); tweaksToggle.classList.add('show'); }\nfunction closeTweaks(){ tweaksEl.classList.remove('open'); setTimeout(()=>tweaksEl.classList.remove('show'),300); tweaksToggle.classList.remove('show');\n  try { window.parent && window.parent !== window && window.parent.postMessage({type:'__edit_mode_dismissed'},'*'); } catch(_){}\n}\ntweaksToggle.addEventListener('click', () => tweaksEl.classList.toggle('open'));\ndocument.getElementById('tweaks-close').addEventListener('click', closeTweaks);\n\n// register listener BEFORE announcing availability\nwindow.addEventListener('message', (e) => {\n  const d = e.data || {};\n  if (d.type === '__activate_edit_mode') openTweaks();\n  if (d.type === '__deactivate_edit_mode') closeTweaks();\n});\ntry { window.parent && window.parent !== window && window.parent.postMessage({type:'__edit_mode_available'},'*'); } catch (_){}\n\n/* ============================================================\n   BOOT\n   ============================================================ */\nasync function boot() {\n  resize();\n  buildTweaks();\n\n  // try real backend\n  let data = null;\n  try {\n    const r = await fetch('/api/brain/graph', { cache: 'no-store' });\n    if (r.ok) data = await r.json();\n  } catch(_) {}\n  if (data && Array.isArray(data.nodes) && Array.isArray(data.edges)) {\n    G = data;\n    document.getElementById('t-source').textContent = `live \u00b7 ${data.stats?.pages ?? data.nodes.length} pages`;\n  } else {\n    G = JSON.parse(JSON.stringify(MOCK));\n    document.getElementById('t-source').textContent = 'mock \u00b7 18 pages';\n  }\n  // pre-fill type fallback\n  G.nodes.forEach(n => { if (!TYPE_STYLE[n.type]) n.type = 'concepts'; });\n  buildLayout();\n  renderStats();\n  renderLegend();\n  requestAnimationFrame(render);\n}\n\nboot();\n<\/script>\n\n\n<\/body><\/html>"</script>
