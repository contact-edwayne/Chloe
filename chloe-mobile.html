// ── iPhone-client orb swap (2026-05-26) ──────────────────────────────────────
// The orb geometry, particles, and chroma/scanline postfx now come from the
// shared JarvisFace holographic-orb modules (the updated orb that
// jarvis-mobile.html loads via holo-app.js) instead of the older inline copies
// below. This is mobile-only — desktop hud.html is untouched. The inline
// ChromaScanlinePass/buildOrb/buildParticles definitions further down are now
// UNUSED dead code (kept to keep this swap surgical); the scene uses the
// aliases below. Served from the static root over Tailscale at /JarvisFace/*.
import { buildOrb as buildOrbHolo }                   from './JarvisFace/holo-orb.js?v=2';
import { buildParticles as buildParticlesHolo }       from './JarvisFace/holo-particles.js?v=2';
import { ChromaScanlinePass as ChromaScanlinePassHolo } from './JarvisFace/holo-postfx.js?v=2';

// ════════════════════════════════════════════════════════════════════════════
// (2026-06-04 cleanup) The inline postfx / orb-shader / particle definitions
// that lived here were DEAD CODE — superseded 2026-05-26 by the shared
// JarvisFace holo modules imported above (buildOrbHolo / buildParticlesHolo /
// ChromaScanlinePassHolo). Excised in the Phase-5 pruning pass; recover from
// git/backups if ever needed.
// ════════════════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════════════════
// SCENE SETUP
// ════════════════════════════════════════════════════════════════════════════
const sceneContainer = document.getElementById('scene');
function getSize() {
  const r = sceneContainer.getBoundingClientRect();
  return { w: r.width || 220, h: r.height || 220 };
}
// ── Re-buildable scene ───────────────────────────────────────────────────────
// The orb's WebGL context must be fully RELEASED (not just shrunk) while the
// arcade owns the GPU — iOS WebKit can't host EmulatorJS + this orb at once, and
// the old __orbPause (renderer.setSize(1,1)) left the context, shaders, and
// buffers allocated, so it still crashed ~1 min into play. teardownOrb() now
// disposes everything and drops the context; initOrb() rebuilds it on close. A
// CSS orb (.orb-css) covers the disc while WebGL is down.
let arcadeSuspended = false;   // true while the arcade overlay owns the GPU
let orbAlive = false;
let renderer, scene, camera, avatar, orb, particles, halo, haloMat,
    composer, bloom, chromaScan;

function initOrb() {
  if (orbAlive) return;
  const { w, h } = getSize();

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.85;
  sceneContainer.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000308, 0.015);

  camera = new THREE.PerspectiveCamera(28, w / h, 0.1, 100);
  camera.position.set(0, 0, 5.4);
  camera.lookAt(0, 0, 0);

  avatar = new THREE.Group();
  scene.add(avatar);

  orb = buildOrbHolo();
  avatar.add(orb.group);

  particles = buildParticlesHolo();
  // De-cloud the moving light tracers/dust on mobile: the JarvisFace particle
  // shaders multiply a `uColor` uniform, so scaling it down dims the bright
  // orbs of light without editing the shared module. Tune the factor to taste.
  particles.group.traverse((o) => {
    const u = o.material && o.material.uniforms;
    if (u && u.uColor && u.uColor.value && u.uColor.value.multiplyScalar) {
      u.uColor.value.multiplyScalar(0.5);
    }
    // Thin the moving light orbs by ~60% (mobile-only): render only the first
    // 40% of each Points cloud via drawRange — no edit to the shared module.
    if (o.isPoints && o.geometry && o.geometry.attributes.position) {
      const n = o.geometry.attributes.position.count;
      o.geometry.setDrawRange(0, Math.floor(n * 0.4));
    }
  });
  scene.add(particles.group);

  // Halo behind the orb
  const haloGeo = new THREE.PlaneGeometry(7, 7);
  haloMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }, uAmp: { value: 0 },
      uColor: { value: new THREE.Color(0x3399ff) },
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime; uniform vec3 uColor; uniform float uAmp;
      varying vec2 vUv;
      void main() {
        vec2 p = vUv - 0.5;
        float d = length(p);
        float glow = smoothstep(0.5, 0.05, d);
        glow = pow(glow, 2.0);
        float pulse = 0.7 + 0.3 * sin(uTime * 0.7) + uAmp * 0.6;
        gl_FragColor = vec4(uColor * glow * pulse * 0.30, glow * 0.30);
      }
    `,
  });
  halo = new THREE.Mesh(haloGeo, haloMat);
  halo.position.z = -1.4;
  scene.add(halo);

  // Postprocessing
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  // Lower strength + higher threshold than the desktop default so the orb's
  // galaxy detail reads instead of blooming out into a white cloud on the small
  // mobile disc (the orb layers are additive-blended, which stacks bright fast).
  bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.32, 0.45, 0.72);
  composer.addPass(bloom);
  chromaScan = new ShaderPass(ChromaScanlinePassHolo);
  composer.addPass(chromaScan);
  composer.addPass(new OutputPass());

  orbAlive = true;
  sceneContainer.classList.remove('orb-css-on');   // hide the CSS fallback
  // Start the render loop (animate is hoisted; clock/running declared below).
  if (!running && !document.hidden && !arcadeSuspended) {
    running = true; clock.getDelta(); requestAnimationFrame(animate);
  }
}

function teardownOrb() {
  // Stop the loop, dispose every GPU resource, and DROP the WebGL context so the
  // emulator is the only context on the page. Never throws.
  running = false; orbAlive = false;
  sceneContainer.classList.add('orb-css-on');       // show the CSS fallback
  try {
    if (scene) scene.traverse((o) => {
      if (o.geometry && o.geometry.dispose) o.geometry.dispose();
      const m = o.material;
      if (m) (Array.isArray(m) ? m : [m]).forEach((mm) => { if (mm && mm.dispose) mm.dispose(); });
    });
  } catch (_) {}
  try { if (composer && composer.dispose) composer.dispose(); } catch (_) {}
  try { if (bloom && bloom.dispose) bloom.dispose(); } catch (_) {}
  try {
    if (renderer) {
      renderer.forceContextLoss();
      renderer.dispose();
      const el = renderer.domElement;
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }
  } catch (_) {}
  renderer = scene = camera = avatar = orb = particles = halo = haloMat =
    composer = bloom = chromaScan = null;
}

// ════════════════════════════════════════════════════════════════════════════
// AMPLITUDE SIMULATION — drives orb visuals based on current state
// ════════════════════════════════════════════════════════════════════════════
function hashN(n) { return Math.abs(Math.sin(n * 12.9898) * 43758.5453) % 1; }
function pnoise(t) {
  const i = Math.floor(t), f = t - i;
  const a = hashN(i), b = hashN(i + 1);
  const u = f * f * (3 - 2 * f);
  return a * (1 - u) + b * u;
}
let amp = 0;
let speakSyllable = 0, nextSyllable = 0;
function updateAmp(t, dt, state) {
  let target = 0;
  if (state === 'idle') {
    target = 0.10 + Math.sin(t * 0.9) * 0.05 + pnoise(t * 0.6) * 0.06;
  } else if (state === 'listening') {
    target = 0.20 + pnoise(t * 1.2) * 0.35 + pnoise(t * 3.7) * 0.12;
  } else if (state === 'thinking') {
    target = 0.35 + pnoise(t * 2.3) * 0.25 + pnoise(t * 5.1) * 0.10;
  } else if (state === 'speaking') {
    speakSyllable -= dt;
    if (speakSyllable <= 0) {
      nextSyllable = 0.85 + Math.random() * 0.5;
      speakSyllable = 0.08 + Math.random() * 0.20;
    }
    const env = Math.max(0, Math.sin((1 - speakSyllable / 0.28) * Math.PI));
    target = 0.20 + env * nextSyllable + pnoise(t * 8) * 0.08;
  }
  amp += (target - amp) * 0.18;
  amp = Math.max(0, Math.min(1, amp));
}

// ════════════════════════════════════════════════════════════════════════════
// ANIMATE — paused while the page is hidden (battery on mobile)
// ════════════════════════════════════════════════════════════════════════════
const clock = new THREE.Clock();
let running = false;   // initOrb() turns this on once the scene exists

function animate() {
  if (!running || !orbAlive) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();
  const state = window.__jarvisState || 'idle';
  updateAmp(t, dt, state);

  const baseSpin = state === 'thinking' ? 0.35 : state === 'speaking' ? 0.15 : 0.08;
  avatar.rotation.y += dt * baseSpin;

  const breathe = 1.0 + amp * 0.04;
  avatar.scale.setScalar(breathe);

  orb.update({ t, dt, state, amp });
  particles.update({ t, dt, state, amp });

  haloMat.uniforms.uTime.value = t;
  haloMat.uniforms.uAmp.value  = amp;
  chromaScan.uniforms.uTime.value = t;

  composer.render();
  requestAnimationFrame(animate);
}

// Build the orb (starts its own render loop), then hide the loader on the
// first frame.
initOrb();
requestAnimationFrame(() => {
  const l = document.getElementById('orb-loader');
  if (l) {
    l.classList.add('hidden');
    setTimeout(() => l.remove(), 600);
  }
});

// Resize observer — keep orb sized to the .scene container if it ever
// changes (e.g. iPhone rotation, dynamic Type changes, etc.)
const ro = new ResizeObserver(() => {
  if (!orbAlive || !renderer) return;   // no-op while the orb is torn down
  const s = getSize();
  if (s.w === 0 || s.h === 0) return;
  renderer.setSize(s.w, s.h);
  composer.setSize(s.w, s.h);
  bloom.setSize(s.w, s.h);
  camera.aspect = s.w / s.h;
  camera.updateProjectionMatrix();
});
ro.observe(sceneContainer);

// Pause the render loop while the tab/PWA is backgrounded — saves a lot
// of phone battery on a tile that's redrawing 60 times a second.
// The arcade overlay can suspend the orb's WebGL loop so two WebGL contexts
// don't run concurrently on the phone (a known renderer-crash trigger).
// arcadeSuspended keeps a foreground/visibility event from un-pausing it
// while the game is still open.
window.__orbPause = () => {
  // Arcade is opening: fully release the orb's WebGL context so EmulatorJS is
  // the only WebGL context on the page. The CSS orb covers the disc meanwhile.
  arcadeSuspended = true;
  try { teardownOrb(); } catch (_) {}
};
window.__orbResume = () => {
  // Arcade closed: rebuild the orb from scratch and resume the render loop.
  arcadeSuspended = false;
  try { initOrb(); } catch (_) {}
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false;
  } else if (!running && !arcadeSuspended && orbAlive) {
    running = true;
    clock.getDelta(); // reset so we don't burn an old long delta
    requestAnimationFrame(animate);
  }
});
</script>

<!-- Wallet UI must be in a REGULAR (non-module) script so its top-level
     functions land on the global scope where handleStructured (in the
     first inline script) can call them via onWalletBalanceResult etc. -->
<script>
// ─────────────────────────────────────────────────────────────────────────────
// WALLET PANE — opens a full-screen sheet over the chat. All transactions
// go through the WS to the Python backend, which gates send via PIN+cap
// in wallet_guard.py. Each receive call generates a fresh BOLT11 — never
// reuse an invoice, that's the point of regenerating per transaction.
// ─────────────────────────────────────────────────────────────────────────────
const walletSheet     = document.getElementById('wallet-sheet');
const walletOpenBtn   = document.getElementById('wallet-open-btn');
const walletCloseBtn  = document.getElementById('wallet-close-btn');
const walletRefreshBtn= document.getElementById('wallet-refresh-btn');
const walletReceiveBtn= document.getElementById('wallet-receive-btn');
const walletSendBtn   = document.getElementById('wallet-send-btn');
const balanceValueEl  = document.getElementById('wallet-balance-value');
const balancePendEl   = document.getElementById('wallet-pending');
const historyListEl   = document.getElementById('wallet-history-list');

const receiveModal      = document.getElementById('receive-modal');
const receiveStepAmount = document.getElementById('receive-step-amount');
const receiveStepResult = document.getElementById('receive-step-result');
const receiveAmountEl   = document.getElementById('receive-amount');
const receiveMemoEl     = document.getElementById('receive-memo');
const receiveStatusEl   = document.getElementById('receive-status');
const receiveQrEl       = document.getElementById('receive-qr');
const receiveBolt11El   = document.getElementById('receive-bolt11');
const receiveResultStatusEl = document.getElementById('receive-result-status');

const sendModal       = document.getElementById('send-modal');
const sendDestEl      = document.getElementById('send-destination');
const sendAmountEl    = document.getElementById('send-amount');
const sendPinEl       = document.getElementById('send-pin');
const sendStatusEl    = document.getElementById('send-status');

let lastInvoice = '';

function wsSendObj(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
    return true;
  }
  return false;
}

function openWallet() {
  walletSheet.classList.add('active');
  refreshBalance();
  refreshHistory();
}

function closeWallet() {
  walletSheet.classList.remove('active');
}

function refreshBalance() {
  balanceValueEl.textContent = '…';
  balancePendEl.textContent  = '';
  if (!wsSendObj({ type: 'wallet_balance' })) {
    balanceValueEl.textContent = '—';
    balancePendEl.textContent  = 'offline';
  }
}

function refreshHistory() {
  if (!wsSendObj({ type: 'wallet_history', limit: 10 })) return;
}

function onWalletBalanceResult(data) {
  if (!data.ok) {
    balanceValueEl.textContent = '—';
    balancePendEl.textContent  = data.error || 'error';
    return;
  }
  balanceValueEl.textContent = (data.balance_sat || 0).toLocaleString();
  const pendIn  = data.pending_receive_sat || 0;
  const pendOut = data.pending_send_sat || 0;
  if (pendIn || pendOut) {
    const parts = [];
    if (pendIn)  parts.push('+' + pendIn.toLocaleString() + ' incoming');
    if (pendOut) parts.push('-' + pendOut.toLocaleString() + ' outgoing');
    balancePendEl.textContent = parts.join(' · ');
  } else {
    balancePendEl.textContent = '';
  }
}

function onWalletHistoryResult(data) {
  if (!data.ok) {
    historyListEl.innerHTML =
      '<div class="history-empty">' + (data.error || 'history unavailable') + '</div>';
    return;
  }
  const payments = data.payments || [];
  if (!payments.length) {
    historyListEl.innerHTML = '<div class="history-empty">no payments yet</div>';
    return;
  }
  historyListEl.innerHTML = payments.map(p => {
    const dir   = (p.type || '').toLowerCase().includes('receive') ? 'in' : 'out';
    const sign  = dir === 'in' ? '+' : '-';
    const sats  = (p.amount_sat || 0).toLocaleString();
    const desc  = (p.description || '').slice(0, 32) || '(no memo)';
    const status= p.status ? p.status.toLowerCase() : '';
    const ts    = p.timestamp ? new Date(p.timestamp * 1000).toLocaleString() : '';
    return (
      '<div class="history-row">' +
        '<div>' +
          '<div>' + escapeHtml(desc) + '</div>' +
          '<div class="history-meta">' + escapeHtml(ts) + ' · ' + escapeHtml(status) + '</div>' +
        '</div>' +
        '<div class="history-amt ' + dir + '">' + sign + sats + ' sat</div>' +
      '</div>'
    );
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ── RECEIVE FLOW ────────────────────────────────────────────────────────────
function openReceive() {
  receiveStepAmount.style.display = '';
  receiveStepResult.style.display = 'none';
  receiveAmountEl.value = '';
  receiveMemoEl.value   = '';
  receiveStatusEl.textContent = '';
  receiveStatusEl.className = 'modal-status';
  receiveModal.classList.add('active');
  setTimeout(() => receiveAmountEl.focus(), 50);
}

function closeReceive() {
  receiveModal.classList.remove('active');
}

function generateInvoice() {
  const amount = parseInt(receiveAmountEl.value, 10);
  if (!amount || amount < 1) {
    receiveStatusEl.textContent = 'Enter a positive amount.';
    receiveStatusEl.className = 'modal-status error';
    return;
  }
  receiveStatusEl.textContent = 'requesting invoice…';
  receiveStatusEl.className = 'modal-status';
  if (!wsSendObj({
    type: 'wallet_create_invoice',
    amount_sat: amount,
    memo: receiveMemoEl.value || ''
  })) {
    receiveStatusEl.textContent = 'WS offline.';
    receiveStatusEl.className = 'modal-status error';
  }
}

function onWalletInvoiceResult(data) {
  if (!receiveModal.classList.contains('active')) return; // not us
  if (!data.ok) {
    receiveStatusEl.textContent = data.error || 'invoice failed';
    receiveStatusEl.className = 'modal-status error';
    return;
  }
  lastInvoice = data.bolt11 || '';
  receiveBolt11El.textContent = lastInvoice;
  // QR — qrcode-generator picks the smallest fitting type. Type 0 = auto.
  // ECC level 'L' (low) is fine for short-lived invoices and yields the
  // densest QR; payment apps decode it readily.
  // Use positional args (cellSize, margin) — the object-arg form silently
  // produces a 1x1 QR in qrcode-generator@1.4.x.
  try {
    const qr = qrcode(0, 'L');
    qr.addData(lastInvoice.toUpperCase());  // alphanumeric mode is denser; bolt11 is case-insensitive
    qr.make();
    receiveQrEl.innerHTML = qr.createSvgTag(5, 4);
    // Force the SVG to fill its container nicely on any screen size.
    const svg = receiveQrEl.querySelector('svg');
    if (svg) {
      svg.setAttribute('width',  '240');
      svg.setAttribute('height', '240');
      svg.style.display = 'block';
    }
  } catch (e) {
    // Fallback: alphanumeric mode rejects some chars; retry as bytes.
    try {
      const qr = qrcode(0, 'L');
      qr.addData(lastInvoice);
      qr.make();
      receiveQrEl.innerHTML = qr.createSvgTag(5, 4);
      const svg = receiveQrEl.querySelector('svg');
      if (svg) { svg.setAttribute('width','240'); svg.setAttribute('height','240'); svg.style.display='block'; }
    } catch (e2) {
      receiveQrEl.innerHTML = '<div style="color:#000;padding:24px;">' +
        'QR render failed: ' + e2.message + '</div>';
    }
  }
  receiveResultStatusEl.textContent =
    'Invoice for ' + (data.amount_sat || 0).toLocaleString() + ' sat ready. ' +
    'Network fee est. ' + (data.fees_sat || 0).toLocaleString() + ' sat.';
  receiveResultStatusEl.className = 'modal-status ok';
  receiveStepAmount.style.display = 'none';
  receiveStepResult.style.display = '';
}

async function copyInvoice() {
  if (!lastInvoice) return;
  try {
    await navigator.clipboard.writeText(lastInvoice);
    receiveResultStatusEl.textContent = 'copied to clipboard';
    receiveResultStatusEl.className = 'modal-status ok';
  } catch (e) {
    receiveResultStatusEl.textContent = 'clipboard blocked: long-press the bolt11 field above to select+copy manually';
    receiveResultStatusEl.className = 'modal-status error';
  }
}

// ── SEND FLOW ───────────────────────────────────────────────────────────────
function openSend() {
  sendDestEl.value   = '';
  sendAmountEl.value = '';
  sendPinEl.value    = '';
  sendStatusEl.textContent = '';
  sendStatusEl.className = 'modal-status';
  document.getElementById('send-confirm-btn').disabled = false;
  sendModal.classList.add('active');
  setTimeout(() => sendDestEl.focus(), 50);
}

function closeSend() {
  sendModal.classList.remove('active');
}

function confirmSend() {
  const dest   = (sendDestEl.value || '').trim();
  const amount = parseInt(sendAmountEl.value, 10);
  const pin    = sendPinEl.value || '';
  if (!dest) {
    sendStatusEl.textContent = 'Destination required.';
    sendStatusEl.className = 'modal-status error';
    return;
  }
  if (!pin) {
    sendStatusEl.textContent = 'PIN required.';
    sendStatusEl.className = 'modal-status error';
    return;
  }
  sendStatusEl.textContent = 'sending…';
  sendStatusEl.className = 'modal-status';
  document.getElementById('send-confirm-btn').disabled = true;
  const payload = { type: 'wallet_send', destination: dest, pin };
  if (Number.isFinite(amount) && amount > 0) payload.amount_sat = amount;
  if (!wsSendObj(payload)) {
    sendStatusEl.textContent = 'WS offline.';
    sendStatusEl.className = 'modal-status error';
    document.getElementById('send-confirm-btn').disabled = false;
  }
  // Wipe the PIN from the DOM the moment we've sent it. The browser-side
  // value is gone — even if the page hangs, no PIN is sitting in memory.
  sendPinEl.value = '';
}

function onWalletSendResult(data) {
  if (!sendModal.classList.contains('active')) return;
  document.getElementById('send-confirm-btn').disabled = false;
  if (!data.ok) {
    sendStatusEl.textContent = data.error || 'send failed';
    sendStatusEl.className = 'modal-status error';
    return;
  }
  sendStatusEl.textContent =
    'Sent ' + (data.amount_sat || 0).toLocaleString() + ' sat ' +
    '(fee ' + (data.fees_sat || 0).toLocaleString() + '). ' +
    (data.status || '');
  sendStatusEl.className = 'modal-status ok';
  // Refresh balance + history in the background after a successful send.
  setTimeout(() => { refreshBalance(); refreshHistory(); }, 500);
}

// ── WIRE UP ─────────────────────────────────────────────────────────────────
if (walletOpenBtn) walletOpenBtn.addEventListener('click', openWallet);  // header btn moved to the orb menu
walletCloseBtn.addEventListener('click',   closeWallet);
walletRefreshBtn.addEventListener('click', () => { refreshBalance(); refreshHistory(); });
walletReceiveBtn.addEventListener('click', openReceive);
walletSendBtn.addEventListener('click',    openSend);

document.getElementById('receive-cancel-btn').addEventListener('click',   closeReceive);
document.getElementById('receive-done-btn').addEventListener('click',     closeReceive);
document.getElementById('receive-generate-btn').addEventListener('click', generateInvoice);
document.getElementById('receive-new-btn').addEventListener('click',      openReceive);
document.getElementById('receive-copy-btn').addEventListener('click',     copyInvoice);

document.getElementById('send-cancel-btn').addEventListener('click',  closeSend);
document.getElementById('send-confirm-btn').addEventListener('click', confirmSend);

// Backdrop tap closes (but only on the backdrop, not the modal contents)
[receiveModal, sendModal].forEach(m => {
  m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('active'); });
});
</script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// DROP-IN — feed Chloe an image, link, or text. Two destinations:
//   • ADD TO BRAIN → POST to brain_http's /api/brain/ingest (vision-describes
//     images, fetches URLs, ingests text into the wiki). Reuses the desktop
//     DROP IN backend verbatim. Reached over the Tailscale-serve path
//     (/brain-api → localhost:6790) on HTTPS, or :6790 directly on local HTTP.
//   • ASK CHLOE → send it straight into the chat. Images ride as a vision
//     content-block the backend already routes to its vision model; links/text
//     go as a normal chat turn. The reply streams + speaks like any other.
// This script runs LAST, so every global from the earlier scripts (ws, busy,
// chatHistory, appendMsg, setState, wsSendObj, CHAT_SYSTEM…) is initialized.
// ─────────────────────────────────────────────────────────────────────────────
const BRAIN_API = (() => {
  const b = new URLSearchParams(location.search).get('brain');
  if (b) return b.replace(/\/+$/, '');
  // On HTTPS (the iPhone path) mixed-content blocks a direct :6790 call, so we
  // go same-origin through the Tailscale-serve path. On local HTTP dev we can
  // hit brain_http directly.
  if (location.protocol === 'https:') return location.origin + '/brain-api';
  return 'http://' + (location.hostname || 'localhost') + ':6790';
})();

// ─── Game panels (chess + arcade) — full-screen overlays served via BRAIN_API.
// On HTTPS this loads /brain-api/<panel>.html (so the panel's relative calls and
// the chess panel's wss://host/chloe-ws all resolve through the same proxy the
// PWA already uses); on local HTTP it hits :6790 directly.
function toggleMobileGame(which, open) {
  const ov = document.getElementById(which === 'chess' ? 'm-chess-overlay' : 'm-arcade-overlay');
  const f  = document.getElementById(which === 'chess' ? 'm-chess-iframe'  : 'm-arcade-iframe');
  if (!ov || !f) return;
  const file = which === 'chess' ? 'chess.html' : 'emulator-mobile.html';
  if (open) {
    try { window.__orbPause && window.__orbPause(); } catch (_) {}  // free the orb's WebGL while playing
    f.src = BRAIN_API + '/' + file + '?t=' + Date.now(); ov.classList.add('on');
  } else {
    // Tell the backend to stop any running watch loop so Chloe's commentary
    // (which plays on the desktop) doesn't keep going after we leave the arcade.
    if (which === 'arcade') { try { wsSendObj({ type: 'game_watch_stop' }); } catch (_) {} }
    ov.classList.remove('on'); f.src = 'about:blank';
    try { window.__orbResume && window.__orbResume(); } catch (_) {}
  }
}
(function wireGameButtons() {
  const map = [
    ['m-chess-btn',  () => toggleMobileGame('chess', true)],
    ['m-arcade-btn', () => toggleMobileGame('arcade', true)],
    ['m-chess-close',  () => toggleMobileGame('chess', false)],
    ['m-arcade-close', () => toggleMobileGame('arcade', false)],
  ];
  for (const [id, fn] of map) {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', fn);
  }
})();

// ─── Crash / suspend recovery ───────────────────────────────────────────────
// EmulatorJS (WebGL) can get the iOS web-content process killed under memory
// pressure — the PWA then reloads to the splash, and on a bfcache restore the
// game overlay could otherwise stay "on" with a dead iframe, hiding the CHESS /
// ARCADE launch buttons until a full app restart. This guarantees that any
// return to the page closes the game overlays and frees the iframe, so the menu
// is always reachable again without quitting the app.
function recoverFromGame() {
  document.querySelectorAll('.game-overlay').forEach((o) => o.classList.remove('on'));
  document.querySelectorAll('.game-overlay iframe').forEach((f) => {
    if (f.src && f.src !== 'about:blank') f.src = 'about:blank';
  });
  try { wsSendObj({ type: 'game_watch_stop' }); } catch (_) {}
  try { window.__orbResume && window.__orbResume(); } catch (_) {}
}
// pageshow fires on every load AND on bfcache restore (persisted=true).
window.addEventListener('pageshow', () => recoverFromGame());
// Returning to the tab after the game's process died: tear the overlay down so
// we land on the menu rather than a black/frozen iframe.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    const arcadeOpen = document.getElementById('m-arcade-overlay');
    const f = document.getElementById('m-arcade-iframe');
    // Only auto-recover the arcade if its iframe has been blanked/lost.
    if (arcadeOpen && arcadeOpen.classList.contains('on') && f && (!f.src || f.src === 'about:blank')) {
      recoverFromGame();
    }
  }
});

const dropinOpenBtn  = document.getElementById('dropin-open-btn');
const dropinModal    = document.getElementById('dropin-modal');
const dropinStatus   = document.getElementById('dropin-status');
const dropinTitleEl  = document.getElementById('dropin-title');
const dropinUrlEl    = document.getElementById('dropin-url');
const dropinTextEl   = document.getElementById('dropin-text');
const dropinFileEl   = document.getElementById('dropin-file');
const dropinPreview  = document.getElementById('dropin-preview');
const dropinBrainBtn = document.getElementById('dropin-brain-btn');
const dropinAskBtn   = document.getElementById('dropin-ask-btn');

let dropinTab = 'image';   // 'image' | 'link' | 'text'
let dropinImage = null;    // { dataUrl, b64, mediaType, name }

function setDropinTab(tab) {
  dropinTab = tab;
  document.querySelectorAll('.dropin-tab').forEach((t) =>
    t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.dropin-pane').forEach((p) =>
    p.classList.toggle('active', p.dataset.pane === tab));
  setDropinStatus('');
}

function setDropinStatus(msg, kind) {
  dropinStatus.textContent = msg || '';
  dropinStatus.className = 'modal-status' + (kind ? ' ' + kind : '');
}

function openDropin() {
  dropinTitleEl.value = '';
  dropinUrlEl.value = '';
  dropinTextEl.value = '';
  dropinFileEl.value = '';
  dropinImage = null;
  dropinPreview.innerHTML = '';
  setDropinStatus('');
  setDropinTab('image');
  dropinModal.classList.add('active');
}
function closeDropin() { dropinModal.classList.remove('active'); }

// Downscale a picked image before sending. iPhone photos are ~4000px / several
// MB; the WS frame cap is 8MB and vision is faster on smaller images. Returns
// { dataUrl, b64, mediaType, name }.
function loadAndDownscaleImage(file, maxDim) {
  maxDim = maxDim || 1280;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('file read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('image decode failed'));
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve({
          dataUrl: dataUrl,
          b64: dataUrl.split(',')[1] || '',
          mediaType: 'image/jpeg',
          name: file.name || 'photo.jpg',
        });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

dropinFileEl.addEventListener('change', async () => {
  const file = dropinFileEl.files && dropinFileEl.files[0];
  if (!file) { dropinImage = null; dropinPreview.innerHTML = ''; return; }
  setDropinStatus('processing image…');
  try {
    dropinImage = await loadAndDownscaleImage(file);
    dropinPreview.innerHTML = '';
    const im = document.createElement('img');
    im.src = dropinImage.dataUrl;
    dropinPreview.appendChild(im);
    setDropinStatus('');
  } catch (e) {
    dropinImage = null;
    setDropinStatus("couldn't read that image: " + (e.message || e), 'error');
  }
});

// base64 (no data: prefix) → Blob, for multipart upload to /api/brain/ingest.
function b64ToBlob(b64, mime) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: mime });
}

async function dropinToBrain() {
  const title = dropinTitleEl.value.trim();
  try {
    let resp;
    if (dropinTab === 'image') {
      if (!dropinImage) { setDropinStatus('pick an image first', 'error'); return; }
      const fd = new FormData();
      fd.append('file', b64ToBlob(dropinImage.b64, dropinImage.mediaType), dropinImage.name);
      if (title) fd.append('title', title);
      setDropinStatus('describing + ingesting image…');
      resp = await fetch(BRAIN_API + '/api/brain/ingest', { method: 'POST', body: fd });
    } else if (dropinTab === 'link') {
      const url = dropinUrlEl.value.trim();
      if (!url) { setDropinStatus('enter a URL first', 'error'); return; }
      setDropinStatus('fetching + ingesting link…');
      resp = await fetch(BRAIN_API + '/api/brain/ingest', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url, title: title }),
      });
    } else {
      const text = dropinTextEl.value.trim();
      if (!text) { setDropinStatus('enter some text first', 'error'); return; }
      setDropinStatus('ingesting text…');
      resp = await fetch(BRAIN_API + '/api/brain/ingest', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, title: title }),
      });
    }
    const out = await resp.json().catch(() => ({}));
    if (!resp.ok || out.error) {
      setDropinStatus('ingest failed: ' + (out.error || resp.status), 'error');
      return;
    }
    const slug = out.slug || out.title || 'ok';
    const sim = Array.isArray(out.similar) ? out.similar.length : 0;
    setDropinStatus('added to brain → ' + slug + (sim ? ' (' + sim + ' related)' : ''), 'ok');
    setTimeout(closeDropin, 1300);
  } catch (e) {
    // A failed HTTPS fetch here almost always means the /brain-api Tailscale
    // path isn't configured yet — surface that hint rather than a bare error.
    setDropinStatus("couldn't reach the brain server (" + (e.message || e) +
      '). On HTTPS this needs the /brain-api Tailscale-serve path — see setup.', 'error');
  }
}

function dropinAskChloe() {
  if (busy) { setDropinStatus('Chloe is busy — wait for the current reply', 'error'); return; }
  if (!wsReady) { setDropinStatus('not connected', 'error'); return; }
  const caption = dropinTitleEl.value.trim();
  let userMsg, histMsg, label;
  if (dropinTab === 'image') {
    if (!dropinImage) { setDropinStatus('pick an image first', 'error'); return; }
    const captionText = caption || 'What is this? Describe what you see.';
    userMsg = { role: 'user', content: [
      { type: 'text', text: captionText },
      { type: 'image', source: { type: 'base64',
        media_type: dropinImage.mediaType, data: dropinImage.b64 } },
    ] };
    // Keep history light: don't retain the full base64 image across turns.
    histMsg = { role: 'user', content: '[sent an image] ' + captionText };
    label = '🖼 ' + (caption || 'image');
  } else if (dropinTab === 'link') {
    const url = dropinUrlEl.value.trim();
    if (!url) { setDropinStatus('enter a URL first', 'error'); return; }
    const body = caption ? (caption + '\n' + url) : url;
    userMsg = { role: 'user', content: body };
    histMsg = userMsg;
    label = '🔗 ' + body;
  } else {
    const text = dropinTextEl.value.trim();
    if (!text) { setDropinStatus('enter some text first', 'error'); return; }
    const body = caption ? (caption + '\n' + text) : text;
    userMsg = { role: 'user', content: body };
    histMsg = userMsg;
    label = body;
  }
  appendMsg('me', label);
  const payload = chatHistory.concat([userMsg]);
  chatHistory.push(histMsg);
  trimHistory();
  busy = true; sendBtn.disabled = true; setState('thinking');
  const ok = wsSendObj({
    type: 'chat', messages: payload, system: CHAT_SYSTEM,
    max_tokens: 1024, reply_audio: true,
  });
  if (!ok) {
    busy = false; sendBtn.disabled = false; setState('idle');
    appendMsg('chloe', '[error] not connected', { error: true });
    return;
  }
  closeDropin();
}

dropinOpenBtn.addEventListener('click', openDropin);
document.getElementById('dropin-close-btn').addEventListener('click', closeDropin);
document.getElementById('dropin-cancel-btn').addEventListener('click', closeDropin);
dropinBrainBtn.addEventListener('click', dropinToBrain);
dropinAskBtn.addEventListener('click', dropinAskChloe);
document.querySelectorAll('.dropin-tab').forEach((t) =>
  t.addEventListener('click', () => setDropinTab(t.dataset.tab)));
dropinModal.addEventListener('click', (e) => { if (e.target === dropinModal) closeDropin(); });
</script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// RECENT CHATS — browse past conversation sessions over the WS.
//   sessions_list  -> sessions_result {sessions:[{start_ts,title,preview,n_turns,modalities}]}
//   session_get    -> session_result  {start_ts,title,turns:[{role,content}]}
//   session_resume -> session_resumed {ok,n_turns}  (rehydrates Chloe's context)
// ─────────────────────────────────────────────────────────────────────────────
const sessionsSheet     = document.getElementById('sessions-sheet');
const sessionsListEl    = document.getElementById('sessions-list');
const sessionsEmptyEl   = document.getElementById('sessions-empty');
const sessionsListView  = document.getElementById('sessions-listview');
const sessionView       = document.getElementById('session-view');
const sessionViewTitle  = document.getElementById('session-view-title');
const sessionViewTurns  = document.getElementById('session-view-turns');
const sessionResumeBtn  = document.getElementById('session-resume-btn');
const sessionResumeStat = document.getElementById('session-resume-status');
let _openSessionTs = null;

function fmtSessionTime(ts) {
  const d = new Date(ts * 1000);
  const now = new Date();
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return 'Today ' + time;
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return 'Yesterday ' + time;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + time;
}

function openSessions() {
  sessionView.style.display = 'none';
  sessionsListView.style.display = '';
  sessionsListEl.innerHTML = '';
  sessionsEmptyEl.style.display = '';
  sessionsEmptyEl.textContent = wsReady ? 'loading…' : 'not connected';
  sessionsSheet.classList.add('active');
  if (wsReady) wsSendObj({ type: 'sessions_list', limit: 40 });
}
function closeSessions() { sessionsSheet.classList.remove('active'); }

// Bulk-delete state (2026-09-06): which sessions are checked, and the
// full set of start_ts currently listed (for "select all" / "delete all").
let _sessSelected = new Set();
let _sessAllTs = [];

function sessUpdateBulkUI() {
  const btn = document.getElementById('sessions-delsel-btn');
  const cnt = document.getElementById('sessions-selcount');
  if (cnt) cnt.textContent = String(_sessSelected.size);
  if (btn) btn.disabled = _sessSelected.size === 0;
}
function sessToggleOne(ts, checked) {
  if (checked) _sessSelected.add(ts); else _sessSelected.delete(ts);
  const selall = document.getElementById('sessions-selall-cb');
  if (selall) selall.checked = _sessAllTs.length > 0 && _sessSelected.size === _sessAllTs.length;
  sessUpdateBulkUI();
}
function sessToggleSelectAll(checked) {
  _sessSelected = new Set(checked ? _sessAllTs : []);
  document.querySelectorAll('#sessions-list .s-cb').forEach((cb) => { cb.checked = checked; });
  sessUpdateBulkUI();
}
function deleteSelectedSessions() {
  if (!_sessSelected.size) return;
  const n = _sessSelected.size;
  if (!confirm(`Delete ${n} chat${n === 1 ? '' : 's'}? This removes ${n === 1 ? 'it' : 'them'} permanently.`)) return;
  if (wsReady) wsSendObj({ type: 'sessions_delete_bulk', start_ts_list: Array.from(_sessSelected) });
}
function deleteAllSessions() {
  if (!_sessAllTs.length) return;
  if (!confirm(`Delete ALL ${_sessAllTs.length} chats? This removes every conversation permanently and can't be undone.`)) return;
  if (wsReady) wsSendObj({ type: 'sessions_delete_bulk', all: true });
}

function onSessionsResult(data) {
  if (!data.ok) {
    sessionsEmptyEl.style.display = '';
    sessionsEmptyEl.textContent = "couldn't load sessions: " + (data.error || '?');
    return;
  }
  const list = Array.isArray(data.sessions) ? data.sessions : [];
  sessionsListEl.innerHTML = '';
  _sessSelected = new Set();
  _sessAllTs = list.map((s) => s.start_ts);
  sessUpdateBulkUI();
  const selall = document.getElementById('sessions-selall-cb');
  if (selall) selall.checked = false;
  if (!list.length) {
    sessionsEmptyEl.style.display = '';
    sessionsEmptyEl.textContent = 'no conversations yet';
    return;
  }
  sessionsEmptyEl.style.display = 'none';
  for (const s of list) {
    const row = document.createElement('div');
    row.className = 'session-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 's-cb';
    cb.addEventListener('click', (e) => {
      e.stopPropagation();
      sessToggleOne(s.start_ts, cb.checked);
    });
    const main = document.createElement('div');
    main.className = 's-main';
    const title = document.createElement('div');
    title.className = 's-title';
    title.textContent = s.title || s.preview || '(untitled)';
    const meta = document.createElement('div');
    meta.className = 's-meta';
    const mods = (s.modalities || []).join('/');
    meta.textContent = fmtSessionTime(s.start_ts) + ' · ' + (s.n_turns || 0)
                       + ' turns' + (mods ? ' · ' + mods : '');
    main.appendChild(title); main.appendChild(meta);
    main.addEventListener('click', () => openSessionView(s.start_ts));
    const del = document.createElement('button');
    del.className = 's-del'; del.textContent = '×'; del.title = 'delete chat';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteSession(s.start_ts, s.title || s.preview || '');
    });
    row.appendChild(cb); row.appendChild(main); row.appendChild(del);
    sessionsListEl.appendChild(row);
  }
}

function openSessionView(start_ts) {
  _openSessionTs = start_ts;
  sessionsListView.style.display = 'none';
  sessionView.style.display = '';
  sessionViewTitle.textContent = 'loading…';
  sessionViewTurns.innerHTML = '';
  sessionResumeStat.textContent = '';
  if (wsReady) wsSendObj({ type: 'session_get', start_ts: start_ts });
}

function onSessionResult(data) {
  if (!data.ok) {
    sessionViewTitle.textContent = "couldn't load: " + (data.error || '?');
    return;
  }
  sessionViewTitle.textContent = data.title || 'conversation';
  sessionViewTurns.innerHTML = '';
  for (const t of (data.turns || [])) {
    const wrap = document.createElement('div');
    wrap.className = 's-turn ' + (t.role === 'user' ? 'user' : 'chloe');
    const role = document.createElement('span');
    role.className = 's-role';
    role.textContent = t.role === 'user' ? 'YOU' : 'CHLOE';
    const body = document.createElement('div');
    body.className = 's-body';
    body.textContent = t.content || '';
    wrap.appendChild(role); wrap.appendChild(body);
    sessionViewTurns.appendChild(wrap);
  }
}

function resumeSession() {
  if (_openSessionTs == null) return;
  if (!wsReady) {
    sessionResumeStat.textContent = 'not connected';
    sessionResumeStat.className = 'modal-status error';
    return;
  }
  sessionResumeStat.textContent = 'resuming…';
  sessionResumeStat.className = 'modal-status';
  wsSendObj({ type: 'session_resume', start_ts: _openSessionTs });
}

function onSessionResumed(data) {
  if (!data.ok) {
    sessionResumeStat.textContent = 'resume failed: ' + (data.error || '?');
    sessionResumeStat.className = 'modal-status error';
    return;
  }
  closeSessions();
  appendMsg('chloe', "↺ resumed this chat — I've got the thread back ("
            + (data.n_turns || 0) + ' turns of context).');
}

function deleteSession(ts, label) {
  if (!confirm('Delete this chat? This removes it permanently.'
               + (label ? '\n\n' + label : ''))) return;
  if (wsReady) wsSendObj({ type: 'session_delete', start_ts: ts });
}
function onSessionDeleted(data) {
  if (!data.ok) {
    sessionsEmptyEl.style.display = '';
    sessionsEmptyEl.textContent = 'delete failed: ' + (data.error || '?');
    return;
  }
  // If we were viewing the just-deleted session, drop back to the list.
  sessionView.style.display = 'none';
  sessionsListView.style.display = '';
  if (wsReady) wsSendObj({ type: 'sessions_list', limit: 40 });  // refresh
}
function onSessionsDeletedBulk(data) {
  if (!data.ok) {
    sessionsEmptyEl.style.display = '';
    sessionsEmptyEl.textContent = 'delete failed: ' + (data.error || '?');
    return;
  }
  if (wsReady) wsSendObj({ type: 'sessions_list', limit: 40 });  // refresh
}
function newChat() {
  if (!wsReady) return;
  wsSendObj({ type: 'session_new' });
}
function onSessionNewDone(data) {
  closeSessions();
  if (data.ok) appendMsg('chloe', "✦ fresh start — cleared the context. what's up?");
}

// Tapping the orb opens a small hub menu (Recent Chats + Wallet) — keeps the
// header clear for the CHLOE // MOBILE wordmark.
const orbMenu = document.getElementById('orb-menu');
function openOrbMenu() { orbMenu.classList.add('active'); }
function closeOrbMenu() { orbMenu.classList.remove('active'); }
const _orbFrameEl = document.querySelector('.orb-frame');
if (_orbFrameEl) _orbFrameEl.addEventListener('click', openOrbMenu);
document.getElementById('orb-menu-chats').addEventListener('click', () => { closeOrbMenu(); openSessions(); });
document.getElementById('orb-menu-wallet').addEventListener('click', () => { closeOrbMenu(); openWallet(); });
document.getElementById('orb-menu-close').addEventListener('click', closeOrbMenu);
orbMenu.addEventListener('click', (e) => { if (e.target === orbMenu) closeOrbMenu(); });
document.getElementById('sessions-close-btn').addEventListener('click', closeSessions);
document.getElementById('sessions-newchat-btn').addEventListener('click', newChat);
document.getElementById('session-delete-btn').addEventListener('click', () => {
  if (_openSessionTs != null) deleteSession(_openSessionTs, sessionViewTitle.textContent);
});
document.getElementById('session-back-btn').addEventListener('click', () => {
  sessionView.style.display = 'none';
  sessionsListView.style.display = '';
});
document.getElementById('sessions-selall-cb').addEventListener('change', (e) => sessToggleSelectAll(e.target.checked));
document.getElementById('sessions-delsel-btn').addEventListener('click', deleteSelectedSessions);
document.getElementById('sessions-delall-btn').addEventListener('click', deleteAllSessions);
sessionResumeBtn.addEventListener('click', resumeSession);
sessionsSheet.addEventListener('click', (e) => { if (e.target === sessionsSheet) closeSessions(); });
</script>

</body>
</html>
