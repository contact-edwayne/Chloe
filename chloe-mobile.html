<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Chloe — mobile PWA client.

  Single-file client that pairs with the existing jarvis.py WebSocket backend
  on the home PC. Works on iOS Safari (add to Home Screen), Android Chrome,
  and desktop browsers.

  Reaching the backend:
    - Backend binds 0.0.0.0:6789 (CHLOE_WS_HOST=0.0.0.0; default since the
      mobile PR).
    - Phone reaches the PC over Tailscale by Tailscale IP or MagicDNS name.
    - Page must be served over HTTPS for getUserMedia to work on Safari.
      (`tailscale serve --bg --https=443 ...` or self-signed + accept.)

  Wire protocol (matches jarvis.py exactly — see hud.html for the desktop
  equivalent):
    HUD → backend  : {type:"chat",      messages, system, max_tokens}
                     {type:"ptt_audio", wav_b64}      ← mobile-only
    backend → HUD  : {type:"start"}, {type:"delta", text}, {type:"done"}
                     {type:"error", text}
                     {type:"voice_exchange", user, assistant}
                     plain string state: idle | listening | thinking | speaking

  Mic path (PTT only — no wake word on mobile by design):
    AudioWorklet captures Float32 frames at the AudioContext rate (typically
    44.1k or 48k on iOS), we resample to 16kHz, encode mono int16 WAV in JS,
    base64, send. Server-side `wave` decodes and runs the existing
    Whisper → Groq → TTS pipeline.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chloe">
<meta name="theme-color" content="#000810">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="chloe_icon.png">
<title>Chloe</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<!-- Three.js import map for the 3D galaxy orb (matches desktop hud.html so
     the same shaders / scene / animation code works unchanged). -->
<script type="importmap">
{
  "imports": {
    "three":         "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --cyan:    #00f7ff;
    --cyan-d:  #00f7ff44;
    --green:   #00ff88;
    --amber:   #ffaa00;
    --red:     #ff3355;
    --bg:      #000810;
    --panel:   #000d1a;
    --border:  #00f7ff2a;
    --border2: #00f7ff55;
  }

  html, body {
    background: var(--bg);
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    /* dvh = dynamic viewport height. On iOS this shrinks when the keyboard
       slides up so the controls don't get hidden behind it. Falls back to
       100% on older browsers (which is the static viewport). */
    height: 100dvh;
    min-height: 100%;
    overflow: hidden;
    /* Honor iOS safe areas (notch / home indicator). Bottom inset is handled
       on .controls instead (with a floor): some iOS standalone contexts report
       env(safe-area-inset-bottom) as 0, which let the home indicator clip the
       PTT hint. Keeping it only on .controls avoids double-spacing. */
    padding: max(env(safe-area-inset-top) - 16px, 8px) env(safe-area-inset-right)
             0 env(safe-area-inset-left);
  }

  /* Subtle backdrop matching the desktop HUD aesthetic */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 20%, #00f7ff10 0%, transparent 60%),
      linear-gradient(rgba(0, 247, 255, 0.025) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(0, 247, 255, 0.025) 1px, transparent 1px) 0 0 / 32px 32px,
      var(--bg);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100%;
    max-width: 720px; margin: 0 auto;
  }

  /* ── HEADER ─────────────────────────────────────────────────────────── */
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    /* Tight top padding so the CHLOE/wallet/connected row sits just under the
       status-bar safe area rather than floating low. */
    padding: 4px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    /* Shrinks + truncates ("// MOBILE" goes first) so the control cluster
       (sessions / wallet / connection) is always fully visible. */
    flex: 1 1 auto; min-width: 0;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan-d);
  }
  .logo .sub {
    font-family: 'Share Tech Mono', monospace;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.6;
    margin-left: 6px;
  }
  .conn {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; letter-spacing: 1px;
    opacity: 0.85;
    white-space: nowrap;
  }
  .conn-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .conn.up   .conn-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .conn.wait .conn-dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

  /* ── ORB ────────────────────────────────────────────────────────────── */
  /* The scene container hosts a Three.js canvas — full WebGL galaxy orb
     ported from the desktop HUD. Wrapped by .orb-frame which carries the
     decorative concentric rings (cockpit chrome). */
  .orb-wrap {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center;
    /* Top padding clears the outermost ring (ring-3 sits at inset -8px) from
       the header divider above. */
    padding: 16px 0 2px;
  }
  /* The frame holds room for the outer rings without affecting the
     canvas itself (canvas size is driven by .scene only). */
  .orb-frame {
    position: relative;
    width: 168px; height: 168px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;  /* tap the orb to open recent chats */
  }
  /* Inner disc that crops the WebGL canvas to a circle and carries the
     cyan border + glow. Sized smaller than the frame so the rings sit
     around it. */
  .scene {
    width: 140px; height: 140px;
    position: relative;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--border2);
    background: radial-gradient(circle at 50% 50%,
      rgba(0, 247, 255, 0.06) 0%,
      transparent 60%);
    box-shadow:
      0 0 28px var(--cyan-d),
      inset 0 0 22px rgba(0, 247, 255, 0.12);
    z-index: 2;
  }
  .scene canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }
  /* Outer concentric rings, layered around the disc to give the orb a
     "HUD instrument" feel. Each one rotates independently. */
  .ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    box-sizing: border-box;
    /* Toned down so the cockpit rings frame the orb without competing with
       its detail. */
    opacity: 0.5;
  }
  /* Ring 1: thin dashed circle just outside the disc (radar sweep). */
  .ring-1 {
    inset: 8px;
    border: 1px dashed rgba(0, 247, 255, 0.30);
    animation: ring-spin-cw 16s linear infinite;
  }
  /* Ring 2: solid faint circle slightly further out, with tick marks
     drawn via conic-gradient. */
  .ring-2 {
    inset: 0;
    border: 1px solid rgba(0, 247, 255, 0.20);
    background:
      conic-gradient(
        from 0deg,
        transparent 0deg,        rgba(0, 247, 255, 0.55) 1deg,
        transparent 2deg,        transparent 30deg,
        rgba(0, 247, 255, 0.35) 31deg, transparent 32deg,
        transparent 60deg,       rgba(0, 247, 255, 0.55) 61deg,
        transparent 62deg,       transparent 90deg,
        rgba(0, 247, 255, 0.35) 91deg, transparent 92deg,
        transparent 120deg,      rgba(0, 247, 255, 0.55) 121deg,
        transparent 122deg,      transparent 150deg,
        rgba(0, 247, 255, 0.35) 151deg, transparent 152deg,
        transparent 180deg,      rgba(0, 247, 255, 0.55) 181deg,
        transparent 182deg,      transparent 210deg,
        rgba(0, 247, 255, 0.35) 211deg, transparent 212deg,
        transparent 240deg,      rgba(0, 247, 255, 0.55) 241deg,
        transparent 242deg,      transparent 270deg,
        rgba(0, 247, 255, 0.35) 271deg, transparent 272deg,
        transparent 300deg,      rgba(0, 247, 255, 0.55) 301deg,
        transparent 302deg,      transparent 330deg,
        rgba(0, 247, 255, 0.35) 331deg, transparent 332deg,
        transparent 360deg);
    /* Mask the conic-gradient to a thin annular ring so it only paints
       at the outer edge (the tick marks). */
    -webkit-mask: radial-gradient(circle, transparent 56%, black 58%, black 62%, transparent 64%);
            mask: radial-gradient(circle, transparent 56%, black 58%, black 62%, transparent 64%);
    animation: ring-spin-ccw 32s linear infinite;
  }
  /* Ring 3: outermost faint dotted circle, slow rotation opposite Ring 1. */
  .ring-3 {
    inset: -8px;
    border: 1px dotted rgba(0, 247, 255, 0.22);
    animation: ring-spin-ccw 48s linear infinite;
  }
  /* Sweep light — a single bright dot orbiting the disc. */
  .sweep {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    pointer-events: none;
    animation: ring-spin-cw 6s linear infinite;
  }
  .sweep::after {
    content: '';
    position: absolute;
    top: -3px; left: 50%;
    width: 6px; height: 6px;
    margin-left: -3px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan-d);
  }
  /* Ambient glow halo behind the whole frame — pulses subtly with breathing. */
  .orb-frame::before {
    content: '';
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(0, 247, 255, 0.10) 0%,
      transparent 70%);
    pointer-events: none;
    animation: orb-breathe 6s ease-in-out infinite;
  }
  @keyframes ring-spin-cw  { from { transform: rotate(0deg);   } to { transform: rotate(360deg);  } }
  @keyframes ring-spin-ccw { from { transform: rotate(360deg); } to { transform: rotate(0deg);    } }
  @keyframes orb-breathe   {
    0%, 100% { opacity: 0.7; transform: scale(1);    }
    50%      { opacity: 1.0; transform: scale(1.06); }
  }
  /* While Three.js initializes (loading shaders / first frame), show a
     tiny pulsing dot so the area doesn't look broken. */
  .orb-loader {
    position: absolute; inset: 50%;
    width: 12px; height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
    animation: orb-loader-pulse 1.2s ease-in-out infinite;
    transition: opacity 0.5s;
  }
  .orb-loader.hidden { opacity: 0; pointer-events: none; }
  @keyframes orb-loader-pulse {
    0%, 100% { transform: scale(1);   opacity: 0.7; }
    50%      { transform: scale(1.6); opacity: 0.2; }
  }
  /* CSS galaxy orb shown while the WebGL orb's context is released for the
     arcade (iOS WebKit can't host EmulatorJS + the Three.js orb at once). Pure
     CSS/compositor — no GPU WebGL context. The surrounding rings/sweep/glow
     keep animating, so the frame still reads as "alive" during play. */
  .orb-css {
    position: absolute; inset: 0;
    border-radius: 50%;
    display: none;
    overflow: hidden;
    background: radial-gradient(circle at 50% 45%,
      rgba(150, 235, 255, 0.95) 0%,
      rgba(40, 150, 230, 0.55) 28%,
      rgba(10, 45, 95, 0.60) 55%,
      rgba(2, 6, 16, 0.92) 80%);
  }
  .orb-css::before {
    content: ''; position: absolute; inset: -25%;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      rgba(0, 247, 255, 0.00) 0deg,   rgba(0, 247, 255, 0.35) 60deg,
      rgba(120, 180, 255, 0.05) 130deg, rgba(0, 247, 255, 0.30) 210deg,
      rgba(0, 247, 255, 0.00) 300deg, rgba(0, 247, 255, 0.00) 360deg);
    mix-blend-mode: screen;
    animation: orb-css-spin 9s linear infinite;
  }
  .orb-css::after {
    content: ''; position: absolute; inset: 18%;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(190, 245, 255, 0.90) 0%,
      rgba(60, 170, 240, 0.25) 45%,
      transparent 70%);
    animation: orb-css-pulse 3.2s ease-in-out infinite;
  }
  .scene.orb-css-on .orb-css { display: block; }
  .scene.orb-css-on canvas   { display: none; }
  @keyframes orb-css-spin  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes orb-css-pulse {
    0%, 100% { transform: scale(0.92); opacity: 0.75; }
    50%      { transform: scale(1.06); opacity: 1.00; }
  }

  .state-label {
    /* Sits clear of ring-3 (inset -8px below the orb frame). */
    margin-top: 16px;
    font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* ── CHAT LOG ───────────────────────────────────────────────────────── */
  .chatlog {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 14px 18px;
    -webkit-overflow-scrolling: touch;
    /* Subtle top divider to separate orb area from chat — the orb sits
       on a different visual plane than the conversation. */
    border-top: 1px solid var(--border);
    margin-top: 6px;
    /* Minimum visible chat area so the most recent reply isn't clipped
       behind the controls when only one or two messages are visible.
       Kept modest so the fixed layout (orb + controls + this min) stays under
       100dvh on shorter iPhones — otherwise the surplus pushes the PTT button
       and hint below the fold (body is overflow:hidden). */
    min-height: 88px;
  }
  .msg {
    display: flex; gap: 8px;
    margin-bottom: 10px;
  }
  .msg.me      { flex-direction: row-reverse; }
  .msg-avatar {
    flex: 0 0 26px;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace;
    font-size: 11px; font-weight: 700;
    background: var(--panel);
  }
  .msg.me .msg-avatar    { color: var(--green);  border-color: #00ff8855; }
  .msg.chloe .msg-avatar { color: var(--cyan);   border-color: var(--border2); }
  .msg-bubble {
    max-width: 78%;
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.me .msg-bubble    { border-color: #00ff8833; background: #001a14; color: #d8ffe8; }
  .msg.chloe .msg-bubble { color: #d8f6ff; }
  .msg-bubble.error      { color: var(--red); border-color: #ff335555; }

  /* Citation block under a Chloe reply (emitted by /search + Brave fallback). */
  .msg-sources {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed #00f7ff33;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 11px;
    line-height: 1.45;
  }
  .msg-sources a {
    color: #aef0ff;
    text-decoration: none;
    opacity: 0.85;
    transition: opacity 0.15s ease-out;
  }
  .msg-sources a:hover {
    opacity: 1;
    text-decoration: underline;
  }
  .msg-sources .src-n {
    color: var(--cyan);
    font-weight: 700;
  }
  .msg-sources .src-domain {
    color: #00f7ff77;
    font-size: 10px;
  }

  /* ── CONTROLS ───────────────────────────────────────────────────────── */
  /* Sits at the bottom. The bottom padding carries the home-indicator
     clearance with a floor — max(inset, 30px) — because some iOS standalone
     contexts report env(safe-area-inset-bottom) as 0, which clipped the PTT
     hint. Body no longer applies inset-bottom, so this is the single source of
     bottom clearance (no double-up, nothing overlaps). */
  .controls {
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    padding: 8px 14px max(env(safe-area-inset-bottom), 48px);
    display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(180deg, transparent 0%, #00050c 50%);
  }
  .text-row {
    display: flex; gap: 8px;
  }
  .text-row input {
    flex: 1; min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--cyan);
    font-family: inherit; font-size: 14px;
    padding: 10px 12px;
    outline: none;
  }
  .text-row input:focus { border-color: var(--cyan); }
  .text-row button {
    flex: 0 0 auto;
    background: var(--cyan); color: #001520;
    border: none; border-radius: 8px;
    font-family: 'Orbitron', monospace;
    font-size: 12px; font-weight: 700; letter-spacing: 2px;
    padding: 0 14px;
    cursor: pointer;
  }
  .text-row button:disabled { opacity: 0.4; cursor: not-allowed; }

  .ptt-btn {
    width: 100%;
    height: 64px;
    background: linear-gradient(180deg, #001a26 0%, #000d14 100%);
    border: 2px solid var(--border2);
    border-radius: 12px;
    color: var(--cyan);
    font-family: 'Orbitron', monospace;
    font-size: 16px; font-weight: 700; letter-spacing: 4px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: all 0.1s;
    /* iOS: prevent the long-press magnifier and callout */
    -webkit-touch-callout: none;
  }
  .ptt-btn:active,
  .ptt-btn.holding {
    background: linear-gradient(180deg, #00ff88 0%, #00aa55 100%);
    color: #000810;
    border-color: var(--green);
    box-shadow: 0 0 20px var(--green);
    transform: scale(0.98);
  }
  .ptt-hint {
    text-align: center;
    font-size: 10px;
    opacity: 0.5;
    letter-spacing: 1px;
  }
  /* ── always-listen toggle (hands-free VAD) ── */
  .ptt-row { display: flex; gap: 8px; align-items: stretch; }
  .ptt-row .ptt-btn { flex: 1; width: auto; }
  .auto-btn {
    flex: 0 0 72px; height: 64px;
    background: linear-gradient(180deg, #001a26 0%, #000d14 100%);
    border: 2px solid var(--border2);
    border-radius: 12px;
    color: var(--cyan);
    font-family: 'Orbitron', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .auto-btn.on {
    background: linear-gradient(180deg, #2b0033 0%, #14001a 100%);
    color: #ff6ec7; border-color: #ff6ec7;
    box-shadow: 0 0 16px rgba(255, 110, 199, .5);
    animation: autopulse 2.2s ease-in-out infinite;
  }
  @keyframes autopulse { 50% { box-shadow: 0 0 5px rgba(255, 110, 199, .2); } }

  /* ── EMPTY STATE ────────────────────────────────────────────────────── */
  .empty {
    text-align: center;
    padding: 30px 20px;
    opacity: 0.5;
    font-size: 13px;
    line-height: 1.6;
  }

  /* ── SPLASH SCREEN ──────────────────────────────────────────────────── */
  /* Ported from the desktop HUD. Sized down for phone viewport. iOS won't
     autoplay audio, so the splash is tap-to-enter on first launch — same
     ceremonial feel as the desktop boot, just user-initiated. The loading
     bar fills in lockstep with the boot.mp3 duration, then the hologram
     shutdown exit animation runs and reveals the app. */
  .splash {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: radial-gradient(circle at center,
                  #001020 0%, #000408 70%, #000000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    /* Tappable initially — iOS audio gating means the user starts the boot. */
    pointer-events: auto;
    transition: opacity 0.7s ease-out;
    opacity: 1;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .splash.hidden { opacity: 0; pointer-events: none; }
  /* Subtle moving scanline texture */
  .splash::before {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg,
        transparent 0,
        transparent 3px,
        rgba(0, 247, 255, 0.04) 3px,
        rgba(0, 247, 255, 0.04) 4px);
    pointer-events: none;
    animation: splash-scan 12s linear infinite;
  }
  /* Outer glow ring at the center */
  .splash::after {
    content: '';
    position: absolute;
    width: 380px; height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle,
                  rgba(0, 247, 255, 0.10) 0%,
                  rgba(0, 247, 255, 0.04) 40%,
                  transparent 70%);
    animation: splash-glow 4s ease-in-out infinite;
    pointer-events: none;
  }
  .splash-content {
    position: relative;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    z-index: 1;
    padding: 0 16px;
  }
  .splash-title {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: 14px;
    color: var(--cyan);
    margin: 0 0 10px 14px;
    text-shadow:
      0 0 16px var(--cyan),
      0 0 36px var(--cyan),
      0 0 60px rgba(0, 247, 255, 0.5);
    animation: splash-title-pulse 2.4s ease-in-out infinite;
  }
  .splash-subtitle {
    font-size: 11px;
    letter-spacing: 7px;
    color: var(--green);
    margin: 0 0 28px 7px;
    opacity: 0.85;
    text-shadow: 0 0 8px var(--green);
  }
  .splash-loading {
    width: 240px;
    height: 3px;
    background: rgba(0, 247, 255, 0.12);
    border-radius: 2px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow:
      0 0 8px rgba(0, 247, 255, 0.3),
      inset 0 0 4px rgba(0, 0, 0, 0.6);
  }
  .splash-loading-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, var(--cyan), var(--green));
    box-shadow: 0 0 12px var(--cyan);
    transition: width 4500ms linear;
  }
  .splash-status {
    margin-top: 18px;
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(0, 247, 255, 0.55);
    min-height: 14px;
    /* Slow blink so "TAP TO BEGIN" feels alive and inviting */
    animation: splash-status-blink 1.8s ease-in-out infinite;
  }
  /* Stop the blink once boot is in progress (set by JS via class) */
  .splash-status.booting { animation: none; }

  @keyframes splash-title-pulse {
    0%, 100% {
      text-shadow:
        0 0 16px var(--cyan),
        0 0 36px var(--cyan),
        0 0 60px rgba(0, 247, 255, 0.5);
    }
    50% {
      text-shadow:
        0 0 24px var(--cyan),
        0 0 50px var(--cyan),
        0 0 90px rgba(0, 247, 255, 0.7);
    }
  }
  @keyframes splash-scan {
    0%   { transform: translateY(0); }
    100% { transform: translateY(100px); }
  }
  @keyframes splash-glow {
    0%, 100% { transform: scale(0.9); opacity: 0.7; }
    50%      { transform: scale(1.1); opacity: 1.0; }
  }
  @keyframes splash-status-blink {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1.0; }
  }

  /* ─── Splash EXIT — "Hologram shutdown" — ported from desktop verbatim.
     Lock-in flash → vertical compress → glitch jitter → horizontal stretch
     → fade. Synced to the boot-sound duration so the visual finishes with
     the audio. */
  .splash.exiting {
    pointer-events: none;
    animation: splash-exit-bg 1100ms cubic-bezier(0.55, 0, 0.4, 1) forwards;
  }
  .splash.exiting .splash-content {
    animation: splash-exit-shutdown 1000ms cubic-bezier(0.7, 0, 0.3, 1) forwards;
    transform-origin: center center;
    will-change: transform, opacity, filter;
  }
  .splash.exiting::before {
    animation: splash-exit-scanflare 1100ms ease-out forwards;
  }
  .splash.exiting::after {
    animation: splash-exit-ringfade 1100ms cubic-bezier(0.55, 0, 0.2, 1) forwards;
  }
  @keyframes splash-exit-bg {
    0%   { opacity: 1; }
    11%  { opacity: 1; filter: brightness(1.25); }
    25%  { opacity: 1; filter: brightness(1); }
    70%  { opacity: 0.55; }
    100% { opacity: 0; }
  }
  @keyframes splash-exit-shutdown {
    0%   { transform: scaleY(1) scaleX(1) translateX(0); opacity: 1; filter: brightness(1) saturate(1); }
    12%  { transform: scaleY(1.04) scaleX(1.03);         opacity: 1; filter: brightness(2.3) saturate(1.3); }
    30%  { transform: scaleY(0.06) scaleX(1.08);         opacity: 1; filter: brightness(1.9) saturate(1.1); }
    42%  { transform: scaleY(0.06) scaleX(1.08) translateX(11px);  filter: brightness(2.0) hue-rotate(8deg);  }
    48%  { transform: scaleY(0.06) scaleX(1.08) translateX(-15px); filter: brightness(1.6) hue-rotate(-10deg); }
    55%  { transform: scaleY(0.06) scaleX(1.08) translateX(0);     filter: brightness(1.8) hue-rotate(0); }
    78%  { transform: scaleY(0.04) scaleX(1.55);         opacity: 0.55; filter: brightness(1.2); }
    100% { transform: scaleY(0)    scaleX(1.8);          opacity: 0;    filter: brightness(0.4); }
  }
  @keyframes splash-exit-scanflare {
    0%   { opacity: 1; filter: brightness(1); }
    11%  { opacity: 1; filter: brightness(3); }
    35%  { opacity: 1; filter: brightness(1.4); }
    100% { opacity: 0; }
  }
  @keyframes splash-exit-ringfade {
    0%   { transform: scale(1);   opacity: 1; }
    50%  { transform: scale(0.7); opacity: 0.5; }
    100% { transform: scale(0.4); opacity: 0; }
  }

  /* ── WALLET ─────────────────────────────────────────────────────────── */
  .wallet-btn {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--amber);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    padding: 6px 10px;
    border-radius: 4px;

    transition: background 0.15s, border-color 0.15s;
  }
  .wallet-btn:hover, .wallet-btn:active {

  .wallet-sheet {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 50;
    display: none;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wallet-sheet.active { display: flex; }
  .wallet-header {

  .wallet-title {

  .wallet-close {

  }
  .balance-card {
    border: 1px solid var(--border2);

  .balance-label {
    font-size: 11px; letter-spacing: 2px; opacity: 0.7;

  }
  .balance-value {
    font-family: 'Orbitron', monospace;
    font-size: 36px; font-weight: 700;

  }
  .balance-unit { font-size: 14px; opacity: 0.7; margin-left: 6px; }

  .balance-refresh {
    margin-top: 10px;
    background: transparent; border: 1px solid var(--border);

  }
  .wallet-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .wallet-action {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--cyan);
    font-family: 'Orbitron', monospace; font-weight: 600;
    letter-spacing: 2px; font-size: 14px;
    padding: 18px 8px;
    border-radius: 4px; cursor: pointer;
    transition: background 0.15s;
  }
  .wallet-action:active { background: rgba(0, 247, 255, 0.1); }
  .wallet-action.send { color: var(--red); border-color: rgba(255, 51, 85, 0.4); }
  .wallet-action.send:active { background: rgba(255, 51, 85, 0.08); }
  .wallet-history {
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .wallet-history-title {
    font-size: 11px; letter-spacing: 2px; opacity: 0.7;
    margin-bottom: 8px;
  }
  .history-row {
    display: flex; justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);

  }
  .history-empty { opacity: 0.5; font-style: italic; padding: 8px 0; }

  /* Modals (Receive / Send / Result) */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 8, 16, 0.92);
    z-index: 60;
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.active { display: flex; }
  .modal {
    width: 100%; max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 20px;
  }
  .modal-title {
    font-family: 'Orbitron', monospace; font-weight: 600;
    letter-spacing: 2px; color: var(--cyan);
    margin-bottom: 14px;
  }
  .modal label {
    display: block;
    font-size: 11px; letter-spacing: 1.5px;
    opacity: 0.7; margin-bottom: 4px; margin-top: 12px;
  }
  .modal input, .modal textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    padding: 10px 12px;
    font-size: 14px;
    border-radius: 3px;
    outline: none;
  }
  .modal input:focus, .modal textarea:focus {
    border-color: var(--cyan); box-shadow: 0 0 0 1px var(--border2);
  }
  .modal textarea { resize: none; min-height: 80px; word-break: break-all; }
  .modal-buttons {
    display: flex; gap: 8px; margin-top: 16px;
  }
  .modal-btn {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--cyan);
    font-family: 'Orbitron', monospace; font-weight: 600;
    letter-spacing: 1.5px; padding: 10px;
    cursor: pointer; border-radius: 3px;
  }
  .modal-btn.primary { background: rgba(0, 247, 255, 0.1); }
  .modal-btn.danger {
    color: var(--red); border-color: rgba(255, 51, 85, 0.4);
    background: rgba(255, 51, 85, 0.08);
  }
  .modal-btn:active { transform: scale(0.97); }
  .modal-status {
    margin-top: 10px; font-size: 12px; opacity: 0.85;
  }
  .modal-status.error { color: var(--red); }
  .modal-status.ok    { color: var(--green); }
  .qr-wrap {
    background: white; padding: 12px; border-radius: 4px;
    margin: 12px auto; width: fit-content;
  }
  .qr-wrap svg { display: block; }
  .invoice-preview {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 8px;
    border-radius: 3px;
    word-break: break-all;
    max-height: 80px; overflow-y: auto;
    margin-top: 6px;
  }

  /* Drop-in (feed Chloe images / links / text) */
  .dropin-btn {
    flex: 0 0 auto;
    width: 42px;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--cyan);
    font-family: 'Orbitron', monospace; font-weight: 700;
    font-size: 20px; line-height: 1;
    border-radius: 4px; cursor: pointer;
  }
  .dropin-btn:active { background: rgba(0, 247, 255, 0.1); }
  .dropin-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    margin-bottom: 4px;
  }
  .dropin-tab {
    background: transparent; border: 1px solid var(--border);
    color: var(--cyan); opacity: 0.55;
    font-family: 'Orbitron', monospace; font-weight: 600;
    letter-spacing: 1.5px; font-size: 11px;
    padding: 9px 4px; border-radius: 3px; cursor: pointer;
  }
  .dropin-tab.active {
    opacity: 1; background: rgba(0, 247, 255, 0.12); border-color: var(--cyan);
  }
  .dropin-pane { display: none; }
  .dropin-pane.active { display: block; }
  .dropin-file-label {
    display: block; text-align: center;
    border: 1px dashed var(--border2); border-radius: 4px;
    padding: 20px 12px; color: var(--cyan); opacity: 0.85;
    cursor: pointer; font-size: 12px; letter-spacing: 1.5px;
    margin-top: 10px;
  }
  .dropin-file-label:active { background: rgba(0, 247, 255, 0.06); }
  .dropin-file-label input { display: none; }
  .dropin-preview { margin-top: 10px; text-align: center; }
  .dropin-preview img {
    max-width: 100%; max-height: 180px;
    border-radius: 4px; border: 1px solid var(--border2);
  }
  .dropin-actions .modal-btn {
    font-size: 11px; letter-spacing: 0.5px; padding: 11px 4px;
  }

  /* Recent chats (session history) */
  .sessions-title { color: var(--cyan) !important; }
  .session-row {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 6px;
    border-bottom: 1px solid var(--border);
  }
  .session-row .s-main { flex: 1 1 auto; min-width: 0; cursor: pointer; }
  .session-row .s-main:active { opacity: 0.7; }
  .s-del {
    flex: 0 0 auto;
    background: transparent; border: 1px solid rgba(255, 51, 85, 0.4);
    color: var(--red); font-size: 16px; line-height: 1;
    width: 30px; height: 30px; border-radius: 4px; cursor: pointer;
  }
  .s-del:active { background: rgba(255, 51, 85, 0.12); }
  .sessions-newchat {
    width: 100%; margin-bottom: 12px;
    background: rgba(0, 247, 255, 0.1); border: 1px solid var(--border2);
    color: var(--cyan); font-family: 'Orbitron', monospace; font-weight: 600;
    letter-spacing: 2px; font-size: 13px; padding: 12px; border-radius: 4px;
    cursor: pointer;
  }
  .sessions-newchat:active { background: rgba(0, 247, 255, 0.18); }
  .sessions-toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .sessions-selall {
    display: flex; align-items: center; gap: 6px;
    color: var(--cyan); opacity: 0.7; font-size: 11px; letter-spacing: 0.5px;
  }
  .sessions-selall input, .s-cb { accent-color: var(--cyan); }
  .sessions-bulk-btn {
    background: rgba(255, 51, 85, 0.08); border: 1px solid rgba(255, 51, 85, 0.4);
    color: var(--red); font-family: inherit; font-size: 11px; letter-spacing: 0.5px;
    padding: 8px 10px; border-radius: 4px;
  }
  .sessions-bulk-btn:active { background: rgba(255, 51, 85, 0.16); }
  .sessions-bulk-btn:disabled { opacity: 0.35; }
  .sessions-bulk-danger { margin-left: auto; }
  #session-delete-btn {
    margin-top: 8px;
    color: var(--red) !important; border-color: rgba(255, 51, 85, 0.4) !important;
  }
  #session-delete-btn:active { background: rgba(255, 51, 85, 0.08); }
  .session-row .s-title {
    color: var(--cyan); font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session-row .s-meta { opacity: 0.55; font-size: 11px; margin-top: 3px; }
  .session-view-title {
    color: var(--cyan); font-size: 15px; letter-spacing: 1px;
    margin: 6px 0 12px;
  }
  .s-turn { margin-bottom: 10px; font-size: 13px; line-height: 1.45; }
  .s-turn .s-role {
    display: block; opacity: 0.6; font-size: 10px; letter-spacing: 1.5px;
    margin-bottom: 2px;
  }
  .s-turn.user .s-role { color: var(--green); }
  .s-turn .s-body { color: #d8f6ff; white-space: pre-wrap; word-break: break-word; }
  #session-resume-btn { margin-top: 14px; width: 100%; }

  /* Orb hub menu (opens on orb tap — recent chats + wallet) */
  .orb-menu-btn {
    display: block; width: 100%; margin-bottom: 10px;
    background: rgba(0, 247, 255, 0.08); border: 1px solid var(--border2);
    color: var(--cyan); font-family: 'Orbitron', monospace; font-weight: 600;
    letter-spacing: 2px; font-size: 14px; padding: 16px; border-radius: 6px;
    cursor: pointer;
  }
  .orb-menu-btn:active { background: rgba(0, 247, 255, 0.16); }
  .orb-menu-btn.wallet { color: var(--amber); border-color: rgba(255, 170, 0, 0.4); }
  .orb-menu-btn.wallet:active { background: rgba(255, 170, 0, 0.1); }
</style>
</head>
<body>
<!-- Startup splash. Tap-to-enter on iOS (audio gating). On tap we play
     boot.mp3 from the static server, fill the loading bar over the
     audio's actual duration, then run the hologram-shutdown exit. -->
<div id="splash-screen" class="splash">
  <div class="splash-content">
    <div class="splash-title">CHLOE</div>
    <div class="splash-subtitle">SYSTEMS INITIALIZING</div>
    <div class="splash-loading">
      <div class="splash-loading-bar" id="splash-bar"></div>
    </div>
    <div class="splash-status" id="splash-status">TAP TO BEGIN</div>
  </div>
</div>

<div class="app">
  <header>
    <div class="logo">CHLOE<span class="sub">// MOBILE</span></div>
    <div class="conn" id="conn"><span class="conn-dot"></span><span id="conn-text">CONNECTING</span></div>
  </header>

  <div class="games-row">
    <button class="game-launch" id="m-chess-btn" type="button">CHESS</button>
    <button class="game-launch" id="m-arcade-btn" type="button">ARCADE</button>
  </div>

  <style>
    .games-row { display: flex; gap: 8px; padding: 6px 12px 0; }
    .game-launch {
      flex: 1; background: rgba(0,247,255,0.06); border: 1px solid rgba(0,247,255,0.35);
      color: #8cf0ff; font-family: inherit; font-size: 12px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 9px 0; border-radius: 4px; cursor: pointer;
    }
    .game-launch:active { background: rgba(0,247,255,0.16); }
    .game-overlay { position: fixed; inset: 0; z-index: 9000; background: #06070b;
      display: none; flex-direction: column; }
    .game-overlay.on { display: flex; }
    .game-close {
      flex: 0 0 auto; background: #0d0f16; color: #8cf0ff; border: none;
      border-bottom: 1px solid rgba(0,247,255,0.3); font-family: inherit;
      font-size: 13px; letter-spacing: 0.2em; cursor: pointer;
      padding: 12px; padding-top: max(12px, env(safe-area-inset-top));
    }
    .game-overlay iframe { flex: 1 1 auto; width: 100%; border: 0; background: #06070b; }
  </style>
  <div class="game-overlay" id="m-chess-overlay">
    <button class="game-close" type="button" id="m-chess-close">CLOSE</button>
    <iframe id="m-chess-iframe" title="Chloe Chess" allow="autoplay"></iframe>
  </div>
  <div class="game-overlay" id="m-arcade-overlay">
    <button class="game-close" type="button" id="m-arcade-close">CLOSE</button>
    <iframe id="m-arcade-iframe" title="Chloe Arcade" allow="autoplay; gamepad; fullscreen; screen-wake-lock"></iframe>
  </div>

  <div class="orb-wrap">
    <div class="orb-frame">
      <div class="ring ring-3"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-1"></div>
      <div class="sweep"></div>
      <div id="scene" class="scene">
        <div id="orb-css" class="orb-css"></div>
        <div id="orb-loader" class="orb-loader"></div>
      </div>
    </div>
    <div class="state-label" id="state-label">IDLE</div>
  </div>

  <div class="chatlog" id="chatlog">
    <div class="empty" id="empty">
      Hold the button below to talk.<br>
      Or type a message and tap SEND.<br>
      Tap the orb for chats &amp; wallet.
    </div>
  </div>

  <div class="controls">
    <div class="text-row">
      <button class="dropin-btn" id="dropin-open-btn" title="Drop in a picture, link, or text">+</button>
      <input id="chat-input" type="text" placeholder="Message Chloe…" autocomplete="off" autocapitalize="sentences">
      <button id="send-btn">SEND</button>
    </div>
    <div class="ptt-row">
      <button class="ptt-btn" id="ptt-btn">HOLD TO TALK</button>
      <button class="auto-btn" id="auto-btn" title="always listening (hands-free)">AUTO</button>
    </div>
    <div class="ptt-hint" id="ptt-hint">tap once to grant mic access</div>
  </div>
</div>

<!-- ── WALLET SHEET ─────────────────────────────────────────────────────── -->
<div class="wallet-sheet" id="wallet-sheet">
  <div class="wallet-header">
    <div class="wallet-title">₿ WALLET</div>
    <button class="wallet-close" id="wallet-close-btn" title="Close">×</button>
  </div>
  <div class="wallet-body">
    <div class="balance-card">
      <div class="balance-label">BALANCE</div>
      <div class="balance-value">
        <span id="wallet-balance-value">—</span><span class="balance-unit">sat</span>
      </div>
      <div class="balance-pending" id="wallet-pending"></div>
      <button class="balance-refresh" id="wallet-refresh-btn">REFRESH</button>
    </div>
    <div class="wallet-actions">
      <button class="wallet-action receive" id="wallet-receive-btn">RECEIVE</button>
      <button class="wallet-action send"    id="wallet-send-btn">SEND</button>
    </div>
    <div class="wallet-history">
      <div class="wallet-history-title">RECENT</div>
      <div id="wallet-history-list">
        <div class="history-empty">no payments yet</div>
      </div>
    </div>
  </div>
</div>

<!-- Receive modal -->
<div class="modal-backdrop" id="receive-modal">
  <div class="modal">
    <div class="modal-title">RECEIVE</div>
    <div id="receive-step-amount">
      <label for="receive-amount">AMOUNT (SAT)</label>
      <input id="receive-amount" type="number" inputmode="numeric" min="1" placeholder="1000">
      <label for="receive-memo">MEMO (OPTIONAL)</label>
      <input id="receive-memo" type="text" placeholder="what's this for?">
      <div class="modal-status" id="receive-status"></div>
      <div class="modal-buttons">
        <button class="modal-btn"          id="receive-cancel-btn">CANCEL</button>
        <button class="modal-btn primary"  id="receive-generate-btn">GENERATE</button>
      </div>
    </div>
    <div id="receive-step-result" style="display:none;">
      <div id="receive-qr" class="qr-wrap"></div>
      <label>BOLT11</label>
      <div class="invoice-preview" id="receive-bolt11"></div>
      <div class="modal-status" id="receive-result-status"></div>
      <div class="modal-buttons">
        <button class="modal-btn"          id="receive-new-btn">NEW</button>
        <button class="modal-btn"          id="receive-copy-btn">COPY</button>
        <button class="modal-btn primary"  id="receive-done-btn">DONE</button>
      </div>
    </div>
  </div>
</div>

<!-- Send modal -->
<div class="modal-backdrop" id="send-modal">
  <div class="modal">
    <div class="modal-title">SEND</div>
    <label for="send-destination">INVOICE OR LIGHTNING ADDRESS</label>
    <textarea id="send-destination" placeholder="lnbc1… or alice@getalby.com"></textarea>
    <label for="send-amount">AMOUNT (SAT) — leave blank if invoice has one</label>
    <input id="send-amount" type="number" inputmode="numeric" min="1" placeholder="(optional)">
    <label for="send-pin">PIN</label>
    <input id="send-pin" type="password" inputmode="text" placeholder="••••" autocomplete="off">
    <div class="modal-status" id="send-status"></div>
    <div class="modal-buttons">
      <button class="modal-btn"        id="send-cancel-btn">CANCEL</button>
      <button class="modal-btn danger" id="send-confirm-btn">SEND</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// SPLASH SCREEN — ported from desktop HUD with iOS-friendly tap-to-enter.
// ─────────────────────────────────────────────────────────────────────────────
// iOS Safari blocks autoplay until a user gesture. Rather than try and fail,
// we present a "TAP TO BEGIN" splash. On tap (which IS a gesture) we play
// boot.mp3 and run the loading bar + hologram-shutdown exit synced to the
// audio's actual duration. Fallback: if audio fails for any reason, splash
// still exits after a fixed timeout so the user isn't stuck.
const splash = {
  el:     () => document.getElementById('splash-screen'),
  bar:    () => document.getElementById('splash-bar'),
  status: () => document.getElementById('splash-status'),
  audio:  null,
  _hidden: false,
  _started: false,

  init() {
    // Pre-load the boot audio so its `duration` is known by the time the
    // user taps. Safari may not actually fetch until play() but preload='auto'
    // is the right hint.
    this.audio = new Audio('sounds/boot.mp3');
    this.audio.preload = 'auto';
    // First tap anywhere on the splash starts the sequence.
    const start = () => this.start();
    const e = this.el();
    e.addEventListener('click',    start, { once: true });
    e.addEventListener('touchend', start, { once: true });
  },

  start() {
    if (this._started) return;
    this._started = true;
    this.setStatus('BOOTING');
    const statusEl = this.status();
    if (statusEl) statusEl.classList.add('booting');

    // Play the audio. play() is allowed here because we're in a click/touch
    // gesture handler. On rejection (rare — usually a missing/blocked file)
    // we still run the visual sequence so the splash doesn't strand.
    let durationS = 4;  // sensible default if audio metadata isn't loaded yet
    const a = this.audio;
    if (a) {
      try {
        const playPromise = a.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch((e) => console.warn('[splash] audio play rejected', e));
        }
      } catch (e) {
        console.warn('[splash] audio play threw', e);
      }
      // If metadata's loaded we have a real duration; otherwise the default
      // is fine (boot.mp3 is ~4.5s per the handoff).
      if (!isNaN(a.duration) && a.duration > 0) durationS = a.duration;
    }

    // Sync the loading bar with the audio
    const ms  = Math.max(500, Math.round(durationS * 1000));
    const bar = this.bar();
    if (bar) {
      bar.style.transition = 'none';
      bar.style.width = '0%';
      void bar.offsetWidth;  // force layout so the next style change animates
      bar.style.transition = `width ${ms}ms linear`;
      bar.style.width = '100%';
    }

    // Schedule the hide just after audio finishes (200ms cushion so the
    // ceremonial exit lines up with the last sound frame).
    setTimeout(() => this.hide(), ms + 200);

    // We're in a user gesture — pre-unlock the reply audio element so the
    // first TTS reply plays through cleanly without iOS autoplay friction.
    // (unlockReplyAudio is defined further down in this script.)
    try {
      if (typeof unlockReplyAudio === 'function') unlockReplyAudio();
    } catch (e) {
      console.warn('[splash] reply audio unlock failed', e);
    }
  },

  setStatus(text) {
    const s = this.status();
    if (s) s.textContent = text;
  },

  hide() {
    if (this._hidden) return;
    this._hidden = true;
    const e = this.el();
    if (!e) return;
    // Stage 1: hologram-shutdown animation (1100ms)
    e.classList.add('exiting');
    // Stage 2: remove from layout so it can't intercept clicks afterwards
    setTimeout(() => {
      e.classList.add('hidden');
      e.style.display = 'none';
    }, 1100);
  },
};
splash.init();
// Safety: if user walks away and never taps, fade after 60s rather than
// keeping the splash up forever.
setTimeout(() => { if (!splash._started) splash.hide(); }, 60000);

// ─────────────────────────────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────────────────────────────
// WebSocket URL resolution:
//   - Override via ?ws=ws://hostname:port in the URL (handy for dev).
//   - If the page is loaded over HTTPS (the production iPhone path), we use
//     wss:// on the same origin at path /chloe-ws — the browser's mixed-
//     content rules block plain ws:// from an HTTPS page, so the WS HAS to
//     be reverse-proxied through HTTPS too. See MOBILE_SETUP.md for the
//     `tailscale serve` recipe that does this.
//   - On plain HTTP (desktop dev test on localhost) we hit port 6789 directly.
const WS_URL = (() => {
  const u = new URLSearchParams(location.search).get('ws');
  if (u) return u;
  if (location.protocol === 'https:') {
    return `wss://${location.host}/chloe-ws`;
  }
  return `ws://${location.hostname || 'localhost'}:6789`;
})();

const TARGET_SR = 16000;  // backend SAMPLE_RATE — Whisper happy here

const CHAT_SYSTEM = (
  "You are Chloe, a personal home assistant. " +
  "Reply in plain spoken sentences only — no markdown, no lists, no headers. " +
  "Keep replies short, friendly, and conversational — usually one or two sentences."
);

// ─────────────────────────────────────────────────────────────────────────────
// DOM
// ─────────────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const stateLabel  = $('state-label');
const chatlog     = $('chatlog');
const emptyEl     = $('empty');
const connEl      = $('conn');
const connText    = $('conn-text');
const inputEl     = $('chat-input');
const sendBtn     = $('send-btn');
const pttBtn      = $('ptt-btn');
const pttHint     = $('ptt-hint');

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let ws = null;
let wsReady = false;
let chatHistory = [];          // [{role, content}]
const HISTORY_MAX = 16;
let currentReplyEl = null;
let currentReplyText = '';
let busy = false;

let micGranted = false;
let audioCtx = null;
let workletNode = null;
let micStream = null;
let pcmBuffer = [];            // Array<Float32Array> at audioCtx.sampleRate
let recording = false;

// ─────────────────────────────────────────────────────────────────────────────
// UI HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function setState(s) {
  stateLabel.textContent = s.toUpperCase();
  // The Three.js orb (loaded as a separate module below) reads
  // window.__jarvisState every frame to decide its animation/turbulence/
  // spin profile. We mirror to __chloeState so future code can prefer
  // the namespaced version too.
  window.__jarvisState = s;
  window.__chloeState  = s;
}
// Expose globally so the orb module can call into the same setState if
// it wants to (matches the desktop HUD's API surface).
window.setState = setState;

function setConn(status) {
  connEl.classList.remove('up', 'wait');
  if (status === 'up')   { connEl.classList.add('up');   connText.textContent = 'CONNECTED'; }
  if (status === 'wait') { connEl.classList.add('wait'); connText.textContent = 'CONNECTING'; }
  if (status === 'down') {                                connText.textContent = 'OFFLINE'; }
}

function appendMsg(who, text, opts = {}) {
  if (emptyEl) emptyEl.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + who;
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = who === 'me' ? 'E' : 'C';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble' + (opts.error ? ' error' : '');
  bubble.textContent = text;
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  chatlog.appendChild(wrap);
  chatlog.scrollTop = chatlog.scrollHeight;
  return wrap;
}

function trimHistory() {
  if (chatHistory.length > HISTORY_MAX) {
    chatHistory.splice(0, chatHistory.length - HISTORY_MAX);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// WEBSOCKET
// ─────────────────────────────────────────────────────────────────────────────
function connectWS() {
  setConn('wait');
  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    console.error('[chloe] WS construct failed', e);
    scheduleReconnect();
    return;
  }
  ws.onopen = () => {
    wsReady = true;
    setConn('up');
    console.log('[chloe] connected to', WS_URL);
  };
  ws.onclose = () => {
    wsReady = false;
    setConn('down');
    console.log('[chloe] WS closed, reconnecting');
    scheduleReconnect();
  };
  ws.onerror = (e) => {
    console.warn('[chloe] WS error', e);
  };
  ws.onmessage = (ev) => {
    const raw = ev.data;
    let data = null;
    try { data = JSON.parse(raw); } catch (_) {}
    if (data && typeof data === 'object') return handleStructured(data);
    if (typeof raw === 'string') {
      const s = raw.trim().toLowerCase();
      if (['idle','listening','thinking','speaking'].includes(s)) setState(s);
    }
  };
}

let reconnectTimer = null;
function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connectWS();
  }, 1500);
}

function handleStructured(data) {
  if (data.type === 'tool_start') {
    if (!currentReplyEl) currentReplyEl = appendMsg('chloe', '');
    currentReplyEl.querySelector('.msg-bubble').textContent = '🔎 ' + (data.text || 'Searching…');
  } else if (data.type === 'start') {
    if (!currentReplyEl) currentReplyEl = appendMsg('chloe', '');
    currentReplyEl.querySelector('.msg-bubble').textContent = '';
    currentReplyText = '';
    setState('thinking');
  } else if (data.type === 'delta') {
    currentReplyText += (data.text || '');
    if (currentReplyEl) {
      currentReplyEl.querySelector('.msg-bubble').textContent = currentReplyText;
      chatlog.scrollTop = chatlog.scrollHeight;
    }
  } else if (data.type === 'sources') {
    // Citation block emitted by /search and the Brave hedge-fallback. Append
    // a small numbered link list inside the current reply bubble.
    if (currentReplyEl && Array.isArray(data.items) && data.items.length) {
      const bubble = currentReplyEl.querySelector('.msg-bubble');
      if (bubble) {
        // Defensive: clear an existing sources block in case backend re-emits.
        const prev = bubble.querySelector('.msg-sources');
        if (prev) prev.remove();
        const wrap = document.createElement('div');
        wrap.className = 'msg-sources';
        for (const it of data.items) {
          const a = document.createElement('a');
          a.href = it.url || '#';
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          const n = document.createElement('span');
          n.className = 'src-n';
          n.textContent = '[' + (it.n || '\u2022') + '] ';
          const t = document.createTextNode(it.title || it.url || '(untitled)');
          a.appendChild(n);
          a.appendChild(t);
          if (it.domain) {
            const d = document.createElement('span');
            d.className = 'src-domain';
            d.textContent = ' \u00B7 ' + it.domain;
            a.appendChild(d);
          }
          wrap.appendChild(a);
        }
        bubble.appendChild(wrap);
      }
    }
  } else if (data.type === 'done') {
    const reply = currentReplyText.trim();
    if (reply) { chatHistory.push({ role: 'assistant', content: reply }); trimHistory(); }
    currentReplyEl = null;
    currentReplyText = '';
    busy = false;
    sendBtn.disabled = false;
  } else if (data.type === 'error') {
    console.error('[chloe] backend error:', data.text);
    if (currentReplyEl) {
      const b = currentReplyEl.querySelector('.msg-bubble');
      b.textContent = '[error] ' + (data.text || 'unknown');
      b.classList.add('error');
    } else {
      appendMsg('chloe', '[error] ' + (data.text || 'unknown'), { error: true });
    }
    currentReplyEl = null;
    currentReplyText = '';
    busy = false;
    sendBtn.disabled = false;
    setState('idle');
  } else if (data.type === 'voice_exchange') {
    // From the backend's voice path (desktop wake-word or another client's PTT)
    // — show it so all clients stay in sync.
    if (data.user)      { appendMsg('me',    '🎤 ' + data.user); chatHistory.push({ role: 'user',      content: data.user }); }
    if (data.assistant) { appendMsg('chloe', data.assistant);    chatHistory.push({ role: 'assistant', content: data.assistant }); }
    trimHistory();
  } else if (data.type === 'reply' && data.text) {
    appendMsg('chloe', data.text);
    busy = false;
    sendBtn.disabled = false;
    setState('idle');
  } else if (data.type === 'ptt_too_short') {
    pttHint.textContent = 'too short — try holding longer';
    setTimeout(() => { pttHint.textContent = 'hold to talk'; }, 2000);
    setState('idle');
  } else if (data.type === 'tts_audio') {
    // Backend synthesized Chloe's reply and is streaming the audio bytes
    // back so we can play them in the browser — no echo through the PC
    // speakers. The format is "mp3" (ElevenLabs/edge-tts) or "wav"
    // (Kokoro). Both are playable directly via a data URL.
    playReplyAudio(data.audio_b64, data.format || 'mp3');
  } else if (data.type === 'tts_audio_chunk') {
    // The Ollama-primary chat path (and the backend's CHLOE_TTS_STREAMING
    // mode) streams Chloe's reply ONE SENTENCE AT A TIME as
    // `tts_audio_chunk` messages rather than one big `tts_audio`. The
    // desktop HUD has always handled these; the PWA didn't — which is the
    // reason mobile replies came back text-only. Queue + play in order.
    enqueueTtsChunk(data.audio_b64 || '', data.format || 'wav',
                    data.chunk_id | 0, !!data.is_final);
  } else if (data.type === 'wallet_balance_result') {
    onWalletBalanceResult(data);
  } else if (data.type === 'wallet_invoice_result') {
    onWalletInvoiceResult(data);
  } else if (data.type === 'wallet_send_result') {
    onWalletSendResult(data);
  } else if (data.type === 'wallet_history_result') {
    onWalletHistoryResult(data);
  } else if (data.type === 'sessions_result') {
    onSessionsResult(data);
  } else if (data.type === 'session_result') {
    onSessionResult(data);
  } else if (data.type === 'session_resumed') {
    onSessionResumed(data);
  } else if (data.type === 'session_deleted') {
    onSessionDeleted(data);
  } else if (data.type === 'sessions_deleted') {
    onSessionsDeletedBulk(data);
  } else if (data.type === 'session_new_done') {
    onSessionNewDone(data);
  }
  // ptt_started / ptt_stopping / ptt_busy / ptt_idle: harmless, ignore on mobile
}

// One Audio element, reused across replies. iOS is happier this way: the
// element gets unlocked the first time we play through it (during a user
// gesture), and subsequent plays don't need a fresh user gesture.
let replyAudioEl = null;

function playReplyAudio(b64, format) {
  // Single-shot supersedes any in-flight chunk stream (a reply is one or the
  // other, never both). Abandon chunk state so its onended chain can't fire
  // after we re-point replyAudioEl below.
  resetTtsChunkStream();
  setState('speaking');
  if (!replyAudioEl) {
    replyAudioEl = new Audio();
    replyAudioEl.preload = 'auto';
  }
  // data URL keeps this self-contained — no Blob URLs to revoke.
  replyAudioEl.src = `data:audio/${format};base64,${b64}`;
  replyAudioEl.onended = () => setState('idle');
  replyAudioEl.onerror = (e) => {
    console.error('[chloe] reply audio error', e);
    appendMsg('chloe', '[playback error — see console]', { error: true });
    setState('idle');
  };
  // .play() returns a Promise on modern browsers; failures here usually
  // mean iOS blocked autoplay because we're outside a user gesture.
  // Since playReplyAudio is called from a WS message (not a user tap),
  // iOS *can* refuse — but only the first time. After a single PTT round-
  // trip the audio element is unlocked.
  replyAudioEl.play().catch((e) => {
    console.error('[chloe] play() rejected', e);
    appendMsg('chloe', '[autoplay blocked — tap PTT once and try again]', { error: true });
    setState('idle');
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// STREAMING TTS — tts_audio_chunk playback
// ─────────────────────────────────────────────────────────────────────────────
// The backend's primary (Ollama) chat path peels completed sentences off the
// reply as the model generates them and broadcasts each as its own
// `tts_audio_chunk` (base64 wav from Kokoro, or mp3 from ElevenLabs/edge-tts).
// We queue them and play sequentially through the SAME <audio> element used by
// the single-shot path, so the iOS unlock earned at the splash/PTT gesture
// carries over and no fresh user gesture is needed mid-stream.
let ttsChunkQueue = [];
let ttsChunkPlaying = false;
let ttsChunkStreamActive = false;
let ttsChunkFinalReceived = false;

function resetTtsChunkStream() {
  ttsChunkQueue = [];
  ttsChunkPlaying = false;
  ttsChunkStreamActive = false;
  ttsChunkFinalReceived = false;
}

function enqueueTtsChunk(b64, format, chunkId, isFinal) {
  // chunk_id 0 — or any chunk arriving while no stream is active — starts a
  // FRESH stream. Stop whatever's playing so a new reply can't queue behind
  // the previous one (mirrors the HUD's new-stream guard for the
  // user-sent-a-new-chat-mid-reply race).
  if (chunkId === 0 || !ttsChunkStreamActive) {
    if (replyAudioEl) { try { replyAudioEl.pause(); } catch (_) {} }
    ttsChunkQueue = [];
    ttsChunkPlaying = false;
    ttsChunkStreamActive = true;
    ttsChunkFinalReceived = false;
  }
  if (isFinal) ttsChunkFinalReceived = true;
  if (b64) ttsChunkQueue.push({ b64, format: format || 'wav' });
  // If playback already drained the queue and stalled waiting on synthesis,
  // this arrival re-kicks it; otherwise the active onended chain pulls it.
  if (!ttsChunkPlaying) playNextTtsChunk();
}

function playNextTtsChunk() {
  if (ttsChunkQueue.length === 0) {
    ttsChunkPlaying = false;
    // Queue empty. If the final chunk has landed, the stream is done; else
    // playback has genuinely stalled and the next enqueueTtsChunk re-kicks.
    if (ttsChunkStreamActive && ttsChunkFinalReceived) {
      ttsChunkStreamActive = false;
      ttsChunkFinalReceived = false;
      setState('idle');
    }
    return;
  }
  ttsChunkPlaying = true;
  setState('speaking');
  const next = ttsChunkQueue.shift();
  if (!replyAudioEl) {
    replyAudioEl = new Audio();
    replyAudioEl.preload = 'auto';
  }
  replyAudioEl.src = `data:audio/${next.format};base64,${next.b64}`;
  replyAudioEl.onended = () => { playNextTtsChunk(); };
  replyAudioEl.onerror = (e) => {
    console.error('[chloe] tts chunk audio error', e);
    playNextTtsChunk();  // skip the bad chunk, keep the stream moving
  };
  replyAudioEl.play().catch((e) => {
    // iOS autoplay refusal only happens if the element was never unlocked
    // (user never dismissed the splash / never used PTT). Bail cleanly so the
    // orb doesn't hang on 'speaking'.
    console.error('[chloe] chunk play() rejected', e);
    resetTtsChunkStream();
    setState('idle');
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// CHAT (text)
// ─────────────────────────────────────────────────────────────────────────────
function sendChat() {
  if (busy) return;
  const text = inputEl.value.trim();
  if (!text) return;
  if (!wsReady) {
    appendMsg('chloe', '[error] not connected — is jarvis.py running?', { error: true });
    scheduleReconnect();
    return;
  }
  appendMsg('me', text);
  const userMsg = { role: 'user', content: text };
  const payload = chatHistory.concat([userMsg]);
  chatHistory.push(userMsg);
  trimHistory();
  inputEl.value = '';

  busy = true;
  sendBtn.disabled = true;
  setState('thinking');
  try {
    ws.send(JSON.stringify({
      type: 'chat',
      messages: payload,
      system: CHAT_SYSTEM,
      max_tokens: 1024,
      // reply_audio: tell the backend to synthesize TTS to bytes and
      // broadcast `tts_audio` back over the WS. Without this the chat
      // path falls through to _speak() on PC speakers, which is why
      // earbud users were hearing replies leak through the desktop.
      // The PWA's tts_audio handler (above) plays it locally.
      reply_audio: true,
    }));
  } catch (e) {
    console.error('[chloe] send failed', e);
    busy = false; sendBtn.disabled = false; setState('idle');
    appendMsg('chloe', '[error] send failed: ' + (e.message || e), { error: true });
  }
}
sendBtn.addEventListener('click', sendChat);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

// ─────────────────────────────────────────────────────────────────────────────
// PTT — mic capture via AudioWorklet, encode WAV in JS, send over WS
// ─────────────────────────────────────────────────────────────────────────────
// Why AudioWorklet (and not MediaRecorder)? iOS Safari's MediaRecorder emits
// MP4/AAC, which we'd need ffmpeg to decode server-side. With AudioWorklet we
// pull raw Float32 PCM, convert to mono int16 @ 16kHz here, and ship a WAV
// the stdlib `wave` module can parse without extra deps.

// Inline AudioWorklet processor as a Blob URL so this stays single-file.
const WORKLET_SRC = `
class MicForwarder extends AudioWorkletProcessor {
  process(inputs) {
    const ch0 = inputs[0] && inputs[0][0];
    if (ch0 && ch0.length) {
      // Copy because the buffer is reused by the audio thread
      this.port.postMessage(new Float32Array(ch0));
    }
    return true;
  }
}
registerProcessor('mic-forwarder', MicForwarder);
`;

// Tiny silent WAV used to "unlock" the reply Audio element on iOS — must
// be invoked from a user gesture, after which programmatic .play() calls
// (i.e. when a tts_audio message arrives over the WS) are allowed.
const SILENT_WAV_DATA_URL =
  'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';

function unlockReplyAudio() {
  if (replyAudioEl && replyAudioEl.dataset && replyAudioEl.dataset.unlocked === '1') return;
  if (!replyAudioEl) {
    replyAudioEl = new Audio();
    replyAudioEl.preload = 'auto';
  }
  replyAudioEl.src = SILENT_WAV_DATA_URL;
  // Mute briefly so the silent play is truly silent even on devices with
  // odd codec quirks; we'll restore volume before the real play.
  replyAudioEl.muted = true;
  const p = replyAudioEl.play();
  if (p && p.then) {
    p.then(() => {
      replyAudioEl.muted = false;
      replyAudioEl.dataset.unlocked = '1';
    }).catch(() => {
      replyAudioEl.muted = false;
      // No worries — first PTT reply may still play; iOS sometimes lets
      // through the first programmatic play even without the prime.
    });
  }
}

async function ensureMic() {
  if (micGranted) return true;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl:  true,
      },
      video: false,
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Some browsers start AudioContext suspended until a user gesture
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const blob = new Blob([WORKLET_SRC], { type: 'application/javascript' });
    const url  = URL.createObjectURL(blob);
    await audioCtx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);

    workletNode = new AudioWorkletNode(audioCtx, 'mic-forwarder');
    workletNode.port.onmessage = (ev) => {
      if (recording) pcmBuffer.push(ev.data);          // manual PTT hold
      else if (autoListen) vadFeed(ev.data);           // hands-free always-listen
    };
    const src = audioCtx.createMediaStreamSource(micStream);
    src.connect(workletNode);
    // Don't connect to destination — we don't want the mic playing back.

    micGranted = true;
    pttHint.textContent = 'hold to talk';
    return true;
  } catch (e) {
    console.error('[chloe] mic init failed', e);
    pttHint.textContent = 'mic blocked — check site settings';
    appendMsg('chloe', '[error] mic permission denied: ' + (e.message || e), { error: true });
    return false;
  }
}

function downsampleTo16k(float32Frames, srcRate) {
  // Concatenate all collected frames
  const total = float32Frames.reduce((s, f) => s + f.length, 0);
  const flat = new Float32Array(total);
  let off = 0;
  for (const f of float32Frames) { flat.set(f, off); off += f.length; }

  if (srcRate === TARGET_SR) return flat;
  // Linear-interpolation downsample. Speech-quality is fine for Whisper.
  const ratio = srcRate / TARGET_SR;
  const outLen = Math.floor(flat.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const idx = i * ratio;
    const i0 = Math.floor(idx);
    const i1 = Math.min(i0 + 1, flat.length - 1);
    const frac = idx - i0;
    out[i] = flat[i0] * (1 - frac) + flat[i1] * frac;
  }
  return out;
}

function encodeWav16kMono(float32) {
  // float32 [-1, 1] → int16 PCM → WAV bytes
  const bytesPerSample = 2;
  const dataLen = float32.length * bytesPerSample;
  const buf = new ArrayBuffer(44 + dataLen);
  const dv  = new DataView(buf);

  // RIFF/WAVE header
  let p = 0;
  const w4 = (s) => { for (let i = 0; i < 4; i++) dv.setUint8(p++, s.charCodeAt(i)); };
  const w32 = (n) => { dv.setUint32(p, n, true); p += 4; };
  const w16 = (n) => { dv.setUint16(p, n, true); p += 2; };

  w4('RIFF');
  w32(36 + dataLen);
  w4('WAVE');
  w4('fmt ');
  w32(16);                      // PCM chunk size
  w16(1);                       // PCM format
  w16(1);                       // mono
  w32(TARGET_SR);
  w32(TARGET_SR * bytesPerSample);
  w16(bytesPerSample);          // block align
  w16(16);                      // bits per sample
  w4('data');
  w32(dataLen);

  // Samples
  for (let i = 0; i < float32.length; i++) {
    let s = Math.max(-1, Math.min(1, float32[i]));
    dv.setInt16(p, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    p += 2;
  }
  return new Uint8Array(buf);
}

function bytesToBase64(u8) {
  // Chunk to avoid stack overflow from String.fromCharCode(...big array)
  let s = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < u8.length; i += CHUNK) {
    s += String.fromCharCode.apply(null, u8.subarray(i, i + CHUNK));
  }
  return btoa(s);
}

async function startPtt() {
  if (recording) return;
  // Unlock the reply Audio element while we're still inside the user
  // gesture from pointerdown. Cheap; idempotent after the first hold.
  unlockReplyAudio();
  const ok = await ensureMic();
  if (!ok) return;
  if (!wsReady) {
    appendMsg('chloe', '[error] not connected to backend', { error: true });
    return;
  }
  pcmBuffer = [];
  recording = true;
  setState('listening');
  pttBtn.classList.add('holding');
}

function stopPtt() {
  if (!recording) return;
  recording = false;
  pttBtn.classList.remove('holding');
  setState('thinking');

  if (pcmBuffer.length === 0) {
    setState('idle');
    return;
  }

  const sr = audioCtx ? audioCtx.sampleRate : TARGET_SR;
  const float16 = downsampleTo16k(pcmBuffer, sr);
  pcmBuffer = [];

  // Floor-check: very short captures = accidental tap
  if (float16.length < TARGET_SR * 0.25) {
    pttHint.textContent = 'too short — try holding longer';
    setTimeout(() => { pttHint.textContent = 'hold to talk'; }, 2000);
    setState('idle');
    return;
  }

  const wavBytes = encodeWav16kMono(float16);
  const b64 = bytesToBase64(wavBytes);

  try {
    // reply_audio: tell the backend to synthesize TTS and ship the bytes
    // back to us instead of playing on the PC speakers. The phone plays
    // the reply locally (earbud-friendly) — see the tts_audio handler.
    ws.send(JSON.stringify({
      type: 'ptt_audio',
      wav_b64: b64,
      reply_audio: true,
    }));
  } catch (e) {
    console.error('[chloe] ptt_audio send failed', e);
    appendMsg('chloe', '[error] ptt send failed: ' + (e.message || e), { error: true });
    setState('idle');
  }
}

// Pointer events handle both touch (iOS) and mouse cleanly
pttBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); startPtt(); });
pttBtn.addEventListener('pointerup',   (e) => { e.preventDefault(); stopPtt();  });
// Cancel = finger slid off the button or browser interrupt
pttBtn.addEventListener('pointercancel', () => stopPtt());
pttBtn.addEventListener('pointerleave',  () => { if (recording) stopPtt(); });

// Spacebar PTT (desktop test convenience)
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat &&
      document.activeElement !== inputEl) {
    e.preventDefault();
    startPtt();
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && document.activeElement !== inputEl) {
    e.preventDefault();
    stopPtt();
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// ALWAYS LISTEN — hands-free VAD (iPhone, 2026-06-07)
// ─────────────────────────────────────────────────────────────────────────────
// Toggle AUTO next to the PTT button: the mic stays open and a lightweight RMS
// voice-activity detector auto-records when Ed speaks (with a preroll so the
// first word isn't clipped) and ships the utterance through the existing
// ptt_audio pipeline when he stops. No wake word — any speech triggers her.
// Capture is gated on window.__chloeState === 'idle', so it never triggers
// while she's thinking or speaking (no self-trigger on her own TTS; the mic
// constraints also request echoCancellation as a second guard), during a
// manual PTT hold, or while the arcade/chess overlay is open. iOS realities:
// the mic is gesture-gated, so re-arming needs one tap after each app launch,
// and listening only runs while the PWA is foreground with the screen on.
const autoBtn = $('auto-btn');
let autoListen     = false;
let vadCapturing   = false;
let vadBuffer      = [];
let vadPreroll     = [];
let vadPrerollLen  = 0;   // ms of preroll currently held
let vadVoicedMs    = 0;
let vadStartTs     = 0;
let vadLastVoiceTs = 0;
let vadIdleSince   = 0;
const VAD = {
  thresh:        parseFloat(localStorage.getItem('chloe_vad_thresh') || '0.022'),
  silenceHangMs: 1100,    // pause length that ends the utterance
  minVoicedMs:   350,     // discard blips shorter than this
  prerollMs:     400,     // audio kept from before the trigger
  maxUtterMs:    30000,   // safety cap per utterance
  resumeTailMs:  2000,    // HARD mute after she stops (was 600 — too short; iOS
                          // echoCancellation is weak on speaker, so her TTS tail
                          // was self-triggering). Nothing fires inside this window.
  adaptiveMs:    2600,    // after the hard mute, stay desensitized for this long,
  adaptiveMult:  2.2,     // peaking at thresh×this right as the mute lifts, then
                          // decaying linearly back to the base threshold.
};

function vadAbort() {
  vadCapturing = false;
  vadBuffer = []; vadPreroll = []; vadPrerollLen = 0; vadVoicedMs = 0;
}

function sendCapturedPcm(frames) {
  // Same encode+send as stopPtt — kept separate so the manual path is untouched.
  const sr = audioCtx ? audioCtx.sampleRate : TARGET_SR;
  const float16 = downsampleTo16k(frames, sr);
  if (float16.length < TARGET_SR * 0.25) return false;
  const wavBytes = encodeWav16kMono(float16);
  ws.send(JSON.stringify({
    type: 'ptt_audio',
    wav_b64: bytesToBase64(wavBytes),
    reply_audio: true,
    auto: true,            // flags VAD captures for the server echo-loop backstop
  }));
  return true;
}

function vadFeed(frame) {
  let sum = 0;
  for (let i = 0; i < frame.length; i++) sum += frame[i] * frame[i];
  const rms = Math.sqrt(sum / frame.length);
  const now = performance.now();
  const sr  = audioCtx ? audioCtx.sampleRate : 48000;
  const frameMs = (frame.length / sr) * 1000;

  if (!vadCapturing) {
    // Rolling preroll so the trigger word's onset isn't clipped.
    vadPreroll.push(frame);
    vadPrerollLen += frameMs;
    while (vadPrerollLen > VAD.prerollMs && vadPreroll.length > 1) {
      vadPrerollLen -= (vadPreroll[0].length / sr) * 1000;
      vadPreroll.shift();
    }
    // Trigger gates.
    if (window.__chloeState !== 'idle') { vadIdleSince = now; return; }
    const sinceIdle = now - vadIdleSince;
    if (sinceIdle < VAD.resumeTailMs) return;          // hard mute after she speaks
    if (document.querySelector('.game-overlay.on')) return;
    if (!wsReady) return;
    // Adaptive threshold: once the hard mute lifts, stay desensitized for a while
    // so her own TTS tail / room echo (iOS echoCancellation is weak on speaker)
    // can't self-trigger. Starts high and decays linearly to the base threshold.
    let effThresh = VAD.thresh;
    if (sinceIdle < VAD.adaptiveMs) {
      const k = 1 - (sinceIdle / VAD.adaptiveMs);      // 1→0 across the window
      effThresh = VAD.thresh * (1 + (VAD.adaptiveMult - 1) * k);
    }
    if (rms >= effThresh) {
      vadCapturing   = true;
      vadBuffer      = vadPreroll.slice();
      vadVoicedMs    = frameMs;
      vadStartTs     = now;
      vadLastVoiceTs = now;
      setState('listening');
      pttHint.textContent = 'auto · hearing you…';
    }
    return;
  }

  // Capturing.
  vadBuffer.push(frame);
  if (rms >= VAD.thresh) { vadLastVoiceTs = now; vadVoicedMs += frameMs; }
  if ((now - vadLastVoiceTs) > VAD.silenceHangMs || (now - vadStartTs) > VAD.maxUtterMs) {
    const frames = vadBuffer;
    const voiced = vadVoicedMs;
    vadAbort();
    pttHint.textContent = 'auto · listening';
    if (voiced < VAD.minVoicedMs) { setState('idle'); return; }
    setState('thinking');
    try {
      if (!sendCapturedPcm(frames)) setState('idle');
    } catch (e) {
      console.error('[chloe] auto-listen send failed', e);
      setState('idle');
    }
  }
}

async function setAutoListen(on) {
  if (on) {
    unlockReplyAudio();
    const ok = await ensureMic();
    if (!ok) return;
    autoListen = true;
    if (autoBtn) { autoBtn.classList.add('on'); autoBtn.textContent = '● STOP';
                   autoBtn.title = 'tap to stop always-listening'; }
    pttHint.textContent = 'listening · tap STOP or 3-finger tap';
    localStorage.setItem('chloe_auto_listen', '1');
  } else {
    autoListen = false;
    vadAbort();
    if (autoBtn) { autoBtn.classList.remove('on'); autoBtn.textContent = 'AUTO';
                   autoBtn.title = 'always listening (hands-free)'; }
    pttHint.textContent = micGranted ? 'hold to talk' : 'tap once to grant mic access';
    localStorage.setItem('chloe_auto_listen', '0');
    if (window.__chloeState === 'listening') setState('idle');
  }
}
if (autoBtn) autoBtn.addEventListener('click', () => setAutoListen(!autoListen));
// A manual PTT hold cancels any in-progress auto capture.
pttBtn.addEventListener('pointerdown', vadAbort);
// PANIC GESTURE — a 3-finger tap anywhere instantly kills always-listening AND
// silences her current reply. Hard manual override if the VAD ever runs away
// (echo loop, noisy room). Volume buttons aren't reachable from the browser, so
// a multi-touch tap is the cheapest always-available kill switch.
document.addEventListener('touchstart', (e) => {
  if (!e.touches || e.touches.length < 3) return;
  if (autoListen) setAutoListen(false);
  vadAbort();
  try { if (typeof replyAudioEl !== 'undefined' && replyAudioEl) replyAudioEl.pause(); } catch (_) {}
  setState('idle');
  pttHint.textContent = 'listening off · 3-finger tap';
}, { passive: true });
// Re-arm on the next launch: iOS gates the mic behind a user gesture, so if
// always-listen was on last session, the first tap anywhere re-enables it.
if (localStorage.getItem('chloe_auto_listen') === '1') {
  pttHint.textContent = 'tap anywhere to resume always-listening';
  const rearm = (e) => {
    document.removeEventListener('pointerdown', rearm);
    if (autoBtn && autoBtn.contains(e.target)) return; // their tap will toggle it
    setAutoListen(true);
  };
  document.addEventListener('pointerdown', rearm);
}

// ─────────────────────────────────────────────────────────────────────────────
// SERVICE WORKER (offline shell)
// ─────────────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('chloe-sw.js').catch(err => {
      console.warn('[chloe] sw register failed:', err);
    });
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────────────────
setState('idle');
connectWS();
</script>

<!-- ─── 3D GALAXY ORB ────────────────────────────────────────────────────
     Ported from the desktop HUD verbatim — the same shaders, particle
     buffers, postFX (bloom + chroma-scanline), state-driven amplitude
     simulation, and animate() loop. Reads window.__jarvisState (set by
     setState above). Only mobile concession: pauses requestAnimationFrame
     when the page is hidden (battery), and the renderer canvas is sized
     to the .scene container which is 220x220 on a phone.
-->
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';
